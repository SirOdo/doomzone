<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOOMZONE 😈🏈</title>
<meta name="description" content="DOOMZONE – würfel die Strafaufgaben für den Fantasy-Football-Verlierer aus, dreh am Glücksrad und lass das Schicksal entscheiden.">
<meta property="og:title" content="DOOMZONE 😈🏈">
<meta property="og:description" content="Roll your fate: Strafaufgaben würfeln, Glücksrad drehen, Verlierer bestrafen.">
<meta property="og:image" content="https://sirodo.github.io/doomzone/logo.svg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0d13">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root{
    --bg:#0a0d13;
    --bg-alt:#0d1119;
    --panel:#141924;
    --panel-2:#181e2b;
    --border:#262d3d;
    --text:#eef1f6;
    --muted:#8892a3;
    --muted-2:#7c8598;
    --crimson:#c8203c;
    --crimson-dim:#7d1526;
    --crimson-glow:#e63a58;
    --violet:#7a3fc0;
    --gold:#d7a92e;
    --green:#3fae63;
    --green-dim:#1f3f2b;
    --red-bad:#e0483f;
    --red-dim:#3f201f;
    --focus:#f2c14e;
    --radius:6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1420 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:96px;
  }
  button{font-family:inherit;cursor:pointer;}
  input, select{font-family:inherit;}
  ::selection{background:var(--crimson-dim);color:#fff;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .app{max-width:480px;margin:0 auto;padding:0 16px;}
  @media (min-width:640px){ .app{max-width:640px;padding:0 24px;} }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 0 14px;
    text-align:center;
  }
  .logo-row{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:34px;line-height:1;margin-bottom:6px;
  }
  .logo-img{ height:68px; width:auto; max-width:92%; display:block; margin:0 auto; }
  h1.title{
    font-size:30px;font-weight:900;letter-spacing:0.03em;margin:0;
    color:var(--crimson-glow);text-transform:uppercase;
    text-shadow:0 0 18px rgba(200,32,60,.35);
  }
  .subtitle{
    color:var(--muted);font-size:13px;margin-top:4px;
  }
  .laces{
    width:120px;height:10px;margin:14px auto 0;opacity:.55;
  }

  .reload-note{
    text-align:center;font-size:11.5px;color:var(--muted-2);
    margin-top:10px;padding:0 20px;
  }

  .dedication{
    text-align:center;font-size:10.5px;color:var(--muted-2);
    opacity:.5;margin:40px 0 12px;font-style:italic;letter-spacing:0.01em;
  }

  /* ---------- top action bar ---------- */
  .topbar-actions{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin:10px 0 4px;
  }
  .link-btn{
    background:none;border:none;color:var(--muted);font-size:13px;
    padding:6px 4px;text-decoration:underline;text-decoration-color:var(--border);
  }
  .link-btn:hover{color:var(--text);}
  .link-btn.danger{color:#d98a8a;}
  .link-btn.danger:hover{color:var(--red-bad);}
  .help-btn{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--muted);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none;
  }

  /* ---------- step nav ---------- */
  .stepnav{margin:18px 0 6px;}
  .stepnav-row{display:flex;align-items:center;}
  .step-chip-wrap{display:flex;flex-direction:column;align-items:center;flex:none;position:relative;}
  .step-chip{
    width:38px;height:38px;border-radius:50%;
    border:2px solid var(--border);background:var(--panel);
    color:var(--muted);font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,color .15s;
  }
  .step-chip.reachable{cursor:pointer;}
  .step-chip.done{background:var(--crimson-dim);border-color:var(--crimson);color:#fff;}
  .step-chip.current{background:var(--crimson);border-color:var(--crimson-glow);color:#fff;box-shadow:0 0 0 3px rgba(200,32,60,.22);}
  .step-label{font-size:10.5px;color:var(--muted-2);margin-top:5px;max-width:64px;text-align:center;line-height:1.2;}
  .step-chip-wrap.current .step-label{color:var(--muted);}
  .step-line{flex:1;height:2px;background:var(--border);margin:0 2px;position:relative;top:-18px;}
  .step-line.filled{background:var(--crimson-dim);}

  .down-caption{
    text-align:center;font-size:12px;color:var(--muted-2);margin:10px 0 0;
    font-style:italic;
  }

  /* ---------- panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-top:16px;
    position:relative;
  }
  .panel::before, .panel::after{
    content:"";position:absolute;width:14px;height:14px;
    border-color:var(--crimson-dim);opacity:.6;
  }
  .panel::before{top:-1px;left:-1px;border-top:2px solid var(--crimson-dim);border-left:2px solid var(--crimson-dim);}
  .panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--crimson-dim);border-right:2px solid var(--crimson-dim);}

  .panel h2{
    font-size:16px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;
  }
  .panel p.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.4;}

  /* ---------- category cards ---------- */
  .cat-card{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;padding-right:58px;margin-bottom:10px;position:relative;
  }
  .cat-card-row{display:flex;gap:10px;align-items:flex-start;}
  .cat-icon-input{
    width:44px;height:44px;border-radius:var(--radius);background:var(--bg-alt);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
    border:1px solid var(--border);color:var(--text);text-align:center;padding:0;
  }
  .cat-icon-input:focus{border-color:var(--crimson);}
  .cat-text-input{
    flex:1;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px 12px;font-size:14px;min-width:0;
  }
  .cat-text-input.err{border-color:var(--red-bad);}
  .cat-remove{
    position:absolute;top:10px;right:10px;
    flex:none;width:40px;height:40px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg-alt);color:var(--muted);font-size:16px;
  }
  .cat-remove:disabled{opacity:.35;cursor:not-allowed;}
  .icon-override-label{font-size:11.5px;color:var(--muted);flex:1;}
  .cat-error{color:var(--red-bad);font-size:11.5px;margin-top:6px;}
  .row-btns{display:flex;gap:10px;margin-top:12px;}
  .btn{
    border-radius:var(--radius);border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);padding:10px 16px;font-size:13.5px;font-weight:600;
  }
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--crimson);border-color:var(--crimson-glow);color:#fff;}
  .btn.primary:disabled{background:var(--panel-2);border-color:var(--border);color:var(--muted);}
  .btn.ghost{background:transparent;}
  .btn.full{width:100%;}
  .btn.small{padding:7px 12px;font-size:12.5px;}

  /* ---------- generic form bits ---------- */
  .field-label{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:block;font-weight:600;}
  .num-input{
    background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px 12px;font-size:15px;width:100%;
  }
  .choice-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .choice-btn-wrap{position:relative;flex:1;min-width:52px;}
  .choice-btn{
    border-radius:var(--radius);border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);padding:12px 0;font-size:14px;font-weight:700;width:100%;text-align:center;
  }
  .choice-btn.active{border-color:var(--crimson);background:var(--crimson-dim);color:#fff;}
  .rec-badge{
    position:absolute;top:-9px;right:-4px;background:var(--gold);color:#241c04;
    font-size:8px;font-weight:800;padding:2px 5px;border-radius:8px;z-index:1;
    white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .slider-emoji{text-align:center;font-size:38px;line-height:1;margin-bottom:4px;}
  .slider-value-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .slider-preset-name{font-size:18px;font-weight:800;color:var(--text);}
  .slider-preset-factor{font-size:13px;color:var(--gold);font-weight:700;}
  .factor-slider{
    width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:var(--border);outline:none;margin:8px 0 6px;
  }
  .factor-slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--crimson);border:2px solid var(--crimson-glow);cursor:pointer;
  }
  .factor-slider::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--crimson);border:2px solid var(--crimson-glow);cursor:pointer;
  }
  .slider-ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted-2);padding:0 2px;}
  .radio-row{display:flex;gap:10px;margin-bottom:14px;}
  .radio-opt{
    flex:1;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel-2);
    padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--muted);
  }
  .radio-opt.active{border-color:var(--crimson);background:var(--crimson-dim);color:#fff;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .toggle{
    width:44px;height:26px;border-radius:14px;background:var(--border);position:relative;flex:none;
    border:1px solid var(--border);
  }
  .toggle.on{background:var(--crimson-dim);border-color:var(--crimson);}
  .toggle .knob{
    width:20px;height:20px;border-radius:50%;background:#c9cdd6;position:absolute;top:2px;left:2px;
    transition:left .15s;
  }
  .toggle.on .knob{left:22px;background:#fff;}

  .field-row{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;padding-right:54px;margin-bottom:10px;position:relative;
  }
  .field-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .type-select{
    flex:none;font-size:11.5px;font-weight:700;padding:5px 6px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);
  }
  .type-select.time_plus{background:var(--green-dim);color:var(--green);border-color:var(--green-dim);}
  .type-select.time_minus{background:var(--red-dim);color:var(--red-bad);border-color:var(--red-dim);}
  .type-select.amount_minus{background:var(--green-dim);color:var(--green);border-color:var(--green-dim);}
  .type-select.amount_plus{background:var(--red-dim);color:var(--red-bad);border-color:var(--red-dim);}
  .type-select.bonus{background:var(--green-dim);color:var(--green);border-color:var(--green-dim);}
  .type-select.handicap{background:var(--red-dim);color:var(--red-bad);border-color:var(--red-dim);}
  .field-label-text{flex:1;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:8px 10px;font-size:13.5px;min-width:0;}
  .field-remove{position:absolute;top:10px;right:10px;flex:none;width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg-alt);color:var(--muted);font-size:14px;}
  .field-remove:disabled{opacity:.3;}
  .field-extra{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .field-unit-label{color:var(--muted);font-size:13px;flex:none;}

  /* ---------- stepper (+/-) ---------- */
  .stepper{display:flex;align-items:center;gap:0;flex:none;}
  .stepper-btn{
    width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg-alt);color:var(--text);font-size:15px;font-weight:700;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper-val{
    min-width:28px;text-align:center;font-weight:800;font-size:14px;color:var(--text);
    font-variant-numeric:tabular-nums;padding:0 4px;
  }

  /* ---------- chip picker (presets + custom value) ---------- */
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chip-btn{
    border-radius:20px;border:1px solid var(--border);background:var(--bg-alt);color:var(--muted);
    padding:6px 12px;font-size:12.5px;font-weight:700;flex:none;
  }
  .chip-btn.active{border-color:var(--crimson);background:var(--crimson-dim);color:#fff;}
  .chip-custom-input{
    width:70px;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:20px;padding:6px 10px;font-size:12.5px;text-align:center;flex:none;
  }

  /* ---------- collapsible "Erweitert" disclosure ---------- */
  .advanced-toggle{
    background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;
    padding:8px 0 0;text-align:left;
  }
  .advanced-arrow{display:inline-block;width:10px;}
  .field-advanced{
    margin-top:8px;padding:10px;background:var(--bg-alt);border:1px solid var(--border);
    border-radius:var(--radius);display:flex;flex-direction:column;gap:8px;
  }

  /* ---------- time-bounds section (Spielregeln) ---------- */
  .time-bounds-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(10,13,19,0) 0%, rgba(10,13,19,.97) 30%);
    padding:18px 16px 16px;
    display:flex;justify-content:center;
  }
  .bottomnav-inner{
    max-width:480px;width:100%;display:flex;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px;
  }
  @media (min-width:640px){ .bottomnav-inner{max-width:640px;} }
  .bottomnav-inner .btn{flex:1;}
  .btn.soft-disabled{opacity:.4;}

  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);
    max-width:calc(480px - 32px);width:calc(100% - 32px);
    background:var(--crimson-dim);border:1px solid var(--crimson);color:#fff;
    font-size:13px;font-weight:600;text-align:center;
    padding:10px 16px;border-radius:var(--radius);z-index:60;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- dice ---------- */
  .dice-stage{display:flex;flex-direction:column;align-items:center;padding:10px 0 18px;}
  .die{
    width:86px;height:86px;border-radius:14px;
    background:linear-gradient(145deg,#1c2230,#12161f);
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:900;color:var(--text);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform .08s;
    cursor:pointer;
  }
  .die.rolling{animation:diceshake .55s ease-in-out;}
  @keyframes diceshake{
    0%{transform:rotate(0deg) scale(1);}
    25%{transform:rotate(-14deg) scale(1.04);}
    50%{transform:rotate(10deg) scale(0.98);}
    75%{transform:rotate(-6deg) scale(1.03);}
    100%{transform:rotate(0deg) scale(1);}
  }
  .die-type-tag{color:var(--muted);font-size:12px;margin-top:10px;font-weight:600;}
  .pending-badge{
    margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center;min-height:18px;
  }
  .pending-badge strong{color:var(--gold);font-size:15px;}

  .cat-assign-list{margin-top:6px;}
  .cat-assign-row{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);
  }
  .cat-assign-row:last-child{border-bottom:none;}
  .cat-assign-icon{font-size:20px;width:28px;text-align:center;flex:none;}
  .cat-assign-name{flex:1;font-size:14px;}
  .cat-assign-slot{
    min-width:44px;height:36px;padding:0 8px;border-radius:var(--radius);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
    color:var(--muted-2);flex:none;font-variant-numeric:tabular-nums;
  }
  .mult-tag{
    font-size:10.5px;color:var(--gold);font-weight:800;margin-left:6px;
  }
  .cat-assign-slot.filled{border-style:solid;border-color:var(--crimson);color:#fff;background:var(--crimson-dim);}
  .cat-assign-slot.assignable{border-color:var(--gold);color:var(--gold);cursor:pointer;}

  /* ---------- time tab ---------- */
  .time-hero{text-align:center;padding:26px 0 8px;}
  .time-hero .big-num{font-size:56px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}
  .time-hero .unit{font-size:15px;color:var(--muted);margin-top:2px;}
  .sum-visual{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .sum-chip{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 12px;font-weight:800;font-size:15px;color:var(--text);
    opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;
  }
  .sum-chip.show{opacity:1;transform:translateY(0);}
  .reveal-num{
    display:inline-block;opacity:0;filter:blur(6px);transform:scale(0.85);
    transition:opacity .5s ease, filter .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .reveal-num.show{opacity:1;filter:blur(0);transform:scale(1);}
  .sum-op{color:var(--muted-2);font-size:15px;align-self:center;}

  /* ---------- wheel ---------- */
  .wheel-stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 10px;}
  .wheel-wrap{position:relative;width:250px;height:250px;cursor:pointer;}
  .wheel-pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:18px solid var(--gold);z-index:2;
  }
  .wheel-svg-holder{width:100%;height:100%;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 6px var(--panel-2), 0 0 0 8px var(--border), 0 10px 30px rgba(0,0,0,.5);}
  .wheel-svg-holder svg{display:block;width:100%;height:100%;}
  .wheel-svg-holder svg g.rotor{transition:transform 2.4s cubic-bezier(.17,.67,.16,1);}
  .wheel-center-dot{
    position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;
    background:var(--panel);border:2px solid var(--border);transform:translate(-50%,-50%);z-index:2;
  }
  .wheel-result-banner{
    margin-top:16px;text-align:center;font-size:14px;min-height:20px;font-weight:700;
  }
  .wheel-empty-msg{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 0;}
  .result-list{margin-top:16px;}
  .result-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:13.5px;font-weight:600;
  }
  .result-row.bonus, .result-row.time_plus, .result-row.amount_minus{background:var(--green-dim);color:var(--green);}
  .result-row.handicap, .result-row.time_minus, .result-row.amount_plus{background:var(--red-dim);color:var(--red-bad);}
  .result-row .amt{font-weight:800;font-variant-numeric:tabular-nums;}

  /* ---------- summary ---------- */
  .summary-block{margin-top:6px;}
  .summary-block h3{font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:700;text-transform:none;}
  .summary-cat-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .summary-cat-value{font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
  .amt-good{color:var(--green);font-weight:800;}
  .amt-bad{color:var(--red-bad);font-weight:800;}
  .amt-warn{color:var(--gold);font-weight:700;}
  .summary-cat-row:last-child{border-bottom:none;}
  .summary-derivation{

  .cat-pick-icon{font-size:20px;flex:none;}
  .cat-pick-name{flex:1;font-size:14px;min-width:0;}
  .cat-pick-val{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;flex:none;}
  .danger-btn{background:var(--crimson);border-color:var(--crimson-glow);color:#fff;}
  .hidden{display:none !important;}
  .fx-canvas{position:fixed;inset:0;pointer-events:none;z-index:40;}
  .capture-pad{
    padding:18px 16px;background:var(--panel);border-radius:var(--radius);
    box-sizing:border-box;overflow:visible;
  }
  .doom-flash{
    position:fixed;inset:0;z-index:39;pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(200,32,60,.55), rgba(200,32,60,0) 70%);
    opacity:0;transition:opacity .35s ease-out;
  }
  .doom-flash.show{opacity:1;}
  @keyframes doomShake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-3px,2px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,-2px);}
    80%{transform:translate(2px,2px);}
  }
  .doom-shake{animation:doomShake .4s ease-in-out;}

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .die.rolling{animation:none;}
    .doom-shake{animation:none;}
    .doom-flash{transition-duration:.01ms;}
    .reveal-num{transition-duration:.01ms;}
    .sum-chip{transition-duration:.01ms;}
    /* the wheel's transitionend event drives the game logic, so we shorten
       the spin instead of removing the transition entirely */
    .wheel-svg-holder svg g.rotor{transition-duration:.4s;}
  }
</style>

<script>
(function(){
"use strict";

// Always points at the live "main" branch (not a pinned commit) so it reflects
// whatever is currently committed in the repo, with a cache-busting timestamp
// so browsers don't keep serving a stale cached copy after an update.
const GITHUB_LOGO_FALLBACK_URL = "https://raw.githubusercontent.com/SirOdo/doomzone/main/logo.svg";

window.handleLogoLoad = function(img){
  // The logo artwork already contains the DOOMZONE wordmark, so hide the
  // separate text heading once an actual logo image has loaded successfully.
  const title = document.getElementById("pageTitle");
  if (title) title.style.display = "none";
};

window.handleLogoError = function(img){
  const tried = img.dataset.fallbackTried;
  if (tried === "0"){
    img.dataset.fallbackTried = "1";
    img.src = GITHUB_LOGO_FALLBACK_URL + "?v=" + Date.now();
  } else {
    // Both the local file and the GitHub fallback failed: fall back to the
    // emoji logo, and make sure the DOOMZONE text heading is visible again.
    img.outerHTML = "😈🏈";
    const title = document.getElementById("pageTitle");
    if (title) title.style.display = "";
  }
};

// Cache-bust the logo request so a freshly replaced logo.svg in the repo
// always shows up instead of a browser-cached old copy. This script tag runs
// after the <img> element above already exists in the DOM, so no need to
// wait for DOMContentLoaded.
(function initLogo(){
  const logoImg = document.getElementById("logoImg");
  if (logoImg) logoImg.src = "logo.svg?v=" + Date.now();
})();

/* ===================== STATE ===================== */

function uid(){ return 'id' + Math.random().toString(36).slice(2,9); }
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Reusable "chip presets + custom value" picker, e.g. Multiplikator, Menge */
function chipRowHTML(presetValues, currentVal, suffix){
  return `<div class="chip-row">
    ${presetValues.map(v => `<button type="button" class="chip-btn ${v===currentVal?'active':''}" data-val="${v}">${v}${suffix||''}</button>`).join("")}
    <input class="chip-custom-input" type="number" min="1" max="1000" step="1" value="${currentVal}" placeholder="eigener Wert">
  </div>`;
}
function wireChipPicker(container, getVal, setVal){
  const chips = container.querySelectorAll(".chip-btn");
  const customInput = container.querySelector(".chip-custom-input");
  chips.forEach(c => {
    c.onclick = () => {
      setVal(parseInt(c.dataset.val, 10));
      chips.forEach(x => x.classList.toggle("active", x===c));
      customInput.value = getVal();
    };
  });
  customInput.oninput = () => {
    setVal(clamp(parseInt(customInput.value, 10) || 1, 1, 1000));
    chips.forEach(c => c.classList.toggle("active", parseInt(c.dataset.val, 10)===getVal()));
  };
}

/* Reusable collapsible "Erweitert" disclosure */
function advancedToggleHTML(role, label, expanded){
  return `<button type="button" class="advanced-toggle" data-role="${role}Toggle"><span class="advanced-arrow">${expanded?'▾':'▸'}</span> ${esc(label)}</button>`;
}
function wireAdvancedToggle(scopeEl, role){
  const btn = scopeEl.querySelector(`[data-role="${role}Toggle"]`);
  const panel = scopeEl.querySelector(`[data-role="${role}Advanced"]`);
  if (!btn || !panel) return;
  btn.onclick = () => {
    const nowHidden = panel.classList.toggle("hidden");
    btn.querySelector(".advanced-arrow").textContent = nowHidden ? "▸" : "▾";
  };
}

/* Reusable +/- stepper (e.g. Gewichtung, Stunden) */
function stepperHTML(role, value, min, max){
  return `<div class="stepper" data-role="${role}Stepper">
    <button type="button" class="stepper-btn" data-role="${role}Dec">−</button>
    <span class="stepper-val" data-role="${role}Val">${value}</span>
    <button type="button" class="stepper-btn" data-role="${role}Inc">+</button>
  </div>`;
}
function wireStepper(scopeEl, role, min, max, getVal, setVal, onChange){
  const dec = scopeEl.querySelector(`[data-role="${role}Dec"]`);
  const inc = scopeEl.querySelector(`[data-role="${role}Inc"]`);
  const val = scopeEl.querySelector(`[data-role="${role}Val"]`);
  if (!dec || !inc || !val) return;
  dec.onclick = () => { setVal(clamp(getVal()-1, min, max)); val.textContent = getVal(); if (onChange) onChange(); };
  inc.onclick = () => { setVal(clamp(getVal()+1, min, max)); val.textContent = getVal(); if (onChange) onChange(); };
}

// Broader fallback groups, checked only if no exact keyword above matched.
const EMOJI_GROUP_FALLBACKS = [
  [["essen"], "🍽️"],
  [["trinken"], "🥤"],
  [["übung","sport"], "💪"],
  [["putz"], "🧹"],
  [["laufen","lauf"], "🏃"],
];

function guessEmoji(text){
  const t = (text||"").toLowerCase();
  for (const [words, emoji] of EMOJI_KEYWORDS){
    if (words.some(w => t.includes(w))) return emoji;
  }
  for (const [words, emoji] of EMOJI_GROUP_FALLBACKS){
    if (words.some(w => t.includes(w))) return emoji;
  }
  return FALLBACK_EMOJI;
}
function catIcon(cat){
  return (cat.customIcon && cat.customIcon.trim()) ? cat.customIcon.trim() : guessEmoji(cat.text);
}

const DICE_OPTIONS = [10,12,20];
const DICE_EMOJI = { 10:"🥱", 12:"😎", 20:"😈" };
const RECOMMENDED_DICE = 20;

const FACTOR_PRESETS = [
  { name:"Tutorial", factor:1.2, emoji:"😌" },
  { name:"Casual", factor:1.1, emoji:"🙂" },
  { name:"Normal", factor:1.0, emoji:"😐" },
  { name:"Hard", factor:0.9, emoji:"😰" },
  { name:"Impossible", factor:0.8, emoji:"💀" },
];
const DEFAULT_FACTOR_INDEX = 2;

function defaultConfig(){
  return {
    categories: [
      { id: uid(), customIcon:"", text:"Bier trinken", multiplier:1 },
      { id: uid(), customIcon:"", text:"km laufen", multiplier:1 },
      { id: uid(), customIcon:"", text:"Hotdogs essen", multiplier:1 },
    ],
    diceType: null,
    timeMode: "dynamic", // fixed | dynamic
    fixedHours: 24,
    dynamicFactorIndex: DEFAULT_FACTOR_INDEX,
    minTimeEnabled: false,
    minTimeHours: 0,
    maxTimeEnabled: false,
    maxTimeHours: 48,
    wheelEnabled: false,
    wheelFields: [],
  };
}

function getDynamicFactor(){ return FACTOR_PRESETS[S.config.dynamicFactorIndex].factor; }

const S = {
  page: "config", // config | game
  config: defaultConfig(),
  configTab: 1,
  maxReachedConfigTab: 1,
  game: null,
  gameTab: 1,
  maxReachedGameTab: 1,
};

function freshGame(){
  const rolls = {};
  S.config.categories.forEach(c => rolls[c.id] = null);
  return {
    rolls,
    pendingRoll: null,
    rollsMade: 0,
    baseHours: null,
    rawBaseHours: null,
    baseClampReason: null,
    totalHours: null,
    timeLog: [],
    wheelPool: buildWheelPool(),
    wheelResults: [],
    wheelRotationBase: 0,
    hasSpunOnce: false,
    confettiFired: false,
    amountAdjustments: {}, // categoryId -> cumulative +/- from the wheel, applied only to the displayed final amount, never to time
  };
}

function buildWheelPool(){
  return S.config.wheelFields.map(f => ({ id: uid(), type: f.type, label: f.label, hours: f.hours, amount: f.amount, weight: f.weight }));
}

/* ===================== VALIDATION ===================== */

function configTab1Valid(){
  const cats = S.config.categories;
  if (cats.length < 2) return false;
  const seen = new Set();
  for (const c of cats){
    const t = c.text.trim().toLowerCase();
    if (!t) return false;
    if (seen.has(t)) return false;
    seen.add(t);
  }
  return true;
}
function configTab2Valid(){
  // "Spielregeln": Würfeltyp + Zeit-Konfiguration combined
  if (S.config.diceType === null) return false;
  if (S.config.timeMode === "fixed"){
    return Number.isFinite(S.config.fixedHours) && S.config.fixedHours >= 1 && S.config.fixedHours <= 72;
  }
  return true;
}
function configTab3Valid(){
  if (!S.config.wheelEnabled) return true;
  return S.config.wheelFields.length >= 1;
}
function configTabValid(n){
  return [null, configTab1Valid, configTab2Valid, configTab3Valid][n]();
}

function getConfigStepWarning(n){
  if (n === 1){
    const cats = S.config.categories;
    if (cats.length < 2) return "Du brauchst mindestens 2 Aufgaben.";
    const seen = new Set();
    for (const c of cats){
      const t = c.text.trim().toLowerCase();
      if (!t) return "Bitte fülle alle Aufgaben-Beschreibungen aus.";
      if (seen.has(t)) return "Zwei Aufgaben haben denselben Namen — bitte eindeutig benennen.";
      seen.add(t);
    }
    return null;
  }
  if (n === 2){
    if (S.config.diceType === null) return "Bitte wähle zuerst einen Würfeltyp aus.";
    if (S.config.timeMode === "fixed" && !(Number.isFinite(S.config.fixedHours) && S.config.fixedHours >= 1 && S.config.fixedHours <= 72)){
      return "Bitte gib eine gültige feste Zeit zwischen 1 und 72 Stunden ein.";
    }
    return null;
  }
  if (n === 3){
    if (S.config.wheelEnabled && S.config.wheelFields.length < 1) return "Füge mindestens ein Rad-Feld hinzu, oder deaktiviere das Glücksrad.";
    return null;
  }
  return null;
}

function gameTab1Valid(){
  return S.config.categories.every(c => S.game.rolls[c.id] !== null);
}
function gameTab2Valid(){ return true; }
function gameTab3Valid(){
  if (!S.config.wheelEnabled) return true;
  return S.game.hasSpunOnce || S.game.wheelPool.length === 0;
}
function gameTabValid(n){
  return [null, gameTab1Valid, gameTab2Valid, gameTab3Valid, ()=>true][n]();
}

/* ===================== NAV LABELS ===================== */

const CONFIG_LABELS = ["Aufgaben","Spielregeln","Glücksrad"];
const CONFIG_DOWNS = ["1st Down","2nd Down","3rd Down"];
const GAME_LABELS = ["Würfeln","Zeit","Glücksrad","Zusammenfassung"];
const GAME_DOWNS = ["1st Down","2nd Down","3rd Down","4th Down"];

/* ===================== RENDER: SHELL ===================== */

function render(){
  renderTopbar();
  renderStepNav();
  renderTabContent();
  renderBottomNav();
}

function renderTopbar(){
  const el = document.getElementById("topbarActions");
  if (S.page === "config"){
    el.innerHTML = `
      <button class="link-btn danger" id="btnResetAll">Reset All</button>
      <button class="help-btn" id="btnHelp" title="Hilfe">?</button>
    `;
  } else {
    el.innerHTML = `
      <button class="link-btn" id="btnBackToConfig">← Zurück zur Config</button>
      <button class="help-btn" id="btnHelp" title="Hilfe">?</button>
    `;
  }
  const helpBtn = document.getElementById("btnHelp");
  if (helpBtn) helpBtn.onclick = showHelpModal;
  const resetBtn = document.getElementById("btnResetAll");
  if (resetBtn) resetBtn.onclick = () => {
    showConfirmModal("Wirklich ALLES zurücksetzen? Alle Aufgaben, Einstellungen und der Spielstand gehen verloren.", () => {
      S.config = defaultConfig();
      S.configTab = 1; S.maxReachedConfigTab = 1;
      S.game = null; S.gameTab = 1; S.maxReachedGameTab = 1;
      S.page = "config";
      render();
    }, { danger:true, confirmText:"Reset All" });
  };
  const backBtn = document.getElementById("btnBackToConfig");
  if (backBtn) backBtn.onclick = () => { S.page = "config"; render(); };
}

function renderStepNav(){
  const nav = document.getElementById("stepNav");
  const cap = document.getElementById("downCaption");
  const labels = S.page === "config" ? CONFIG_LABELS : GAME_LABELS;
  const downs = S.page === "config" ? CONFIG_DOWNS : GAME_DOWNS;
  const current = S.page === "config" ? S.configTab : S.gameTab;
  const maxReached = S.page === "config" ? S.maxReachedConfigTab : S.maxReachedGameTab;

  let html = '<div class="stepnav-row">';
  labels.forEach((label, i) => {
    const n = i+1;
    const reachable = n <= maxReached;
    let cls = "step-chip";
    if (n < current) cls += " done";
    if (n === current) cls += " current";
    if (reachable) cls += " reachable";
    html += `<div class="step-chip-wrap ${n===current?'current':''}">
      <div class="${cls}" data-step="${n}" ${reachable?'':'aria-disabled="true"'}>${n < current ? '✓' : n}</div>
      <div class="step-label">${label}</div>
    </div>`;
    if (i < labels.length-1){
      html += `<div class="step-line ${n < current ? 'filled':''}"></div>`;
    }
  });
  html += '</div>';
  nav.innerHTML = html;
  cap.textContent = `🏈 ${downs[current-1]}`;

  nav.querySelectorAll(".step-chip.reachable").forEach(chip => {
    chip.onclick = () => {
      const n = parseInt(chip.dataset.step, 10);
      if (S.page === "config") S.configTab = n; else S.gameTab = n;
      render();
    };
  });
}

function renderBottomNav(){
  const el = document.getElementById("bottomNav");
  if (S.page === "config"){
    const tab = S.configTab;
    const valid = configTabValid(tab);
    let rightBtn;
    if (tab < 3){
      rightBtn = `<button class="btn primary ${valid?'':'soft-disabled'}" id="navNext">Weiter →</button>`;
    } else {
      rightBtn = `<button class="btn primary ${valid?'':'soft-disabled'}" id="navRoll">Let's Roll! 🏈</button>`;
    }
    el.innerHTML = `
      <button class="btn ghost" id="navBack" ${tab===1?'disabled':''}>← Zurück</button>
      ${rightBtn}
    `;
    const back = document.getElementById("navBack");
    if (back) back.onclick = () => { if (S.configTab>1){ S.configTab--; render(); } };
    const next = document.getElementById("navNext");
    if (next) next.onclick = () => {
      if (configTabValid(S.configTab)){
        S.configTab++; S.maxReachedConfigTab = Math.max(S.maxReachedConfigTab, S.configTab); render();
      } else {
        showToast(getConfigStepWarning(S.configTab));
      }
    };
    const roll = document.getElementById("navRoll");
    if (roll) roll.onclick = () => {
      if (!configTabValid(S.configTab)){ showToast(getConfigStepWarning(S.configTab)); return; }
      S.game = freshGame();
      S.page = "game"; S.gameTab = 1; S.maxReachedGameTab = 1;
      render();
    };
  } else {
    const tab = S.gameTab;
    const valid = gameTabValid(tab);
    let nextLabel = "Weiter →";
    if (tab === 3 && S.config.wheelEnabled) nextLabel = "Get me out";
    let rightBtn = tab < 4
      ? `<button class="btn primary" id="navNext" ${valid?'':'disabled'}>${nextLabel}</button>`
      : ``;
    el.innerHTML = `
      <button class="btn ghost" id="navBack" ${tab===1?'disabled':''}>← Zurück</button>
      ${rightBtn}
    `;
    const back = document.getElementById("navBack");
    if (back) back.onclick = () => { if (S.gameTab>1){ S.gameTab--; render(); } };
    const next = document.getElementById("navNext");
    if (next) next.onclick = () => {
      if (!gameTabValid(S.gameTab)) return;
      if (S.gameTab === 1 && S.game.baseHours === null) computeBaseHours();
      S.gameTab++; S.maxReachedGameTab = Math.max(S.maxReachedGameTab, S.gameTab);
      render();
    };
  }
}

function renderTabContent(){
  const el = document.getElementById("tabContent");
  el.innerHTML = "";
  if (S.page === "config"){
    if (S.configTab===1) el.appendChild(buildConfigTab1());
    if (S.configTab===2) el.appendChild(buildConfigTab2());
    if (S.configTab===3) el.appendChild(buildConfigTab3());
  } else {
    if (S.gameTab===1) el.appendChild(buildGameTab1());
    if (S.gameTab===2) el.appendChild(buildGameTab2());
    if (S.gameTab===3) el.appendChild(buildGameTab3());
    if (S.gameTab===4) el.appendChild(buildGameTab4());
  }
}

/* small helper to only refresh nav-dependent bits without full page rebuild */
function refreshNavOnly(){ renderStepNav(); renderBottomNav(); }

/* ===================== CONFIG TAB 1: Aufgaben ===================== */

function buildConfigTab1(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `
    <h2>Strafaufgaben</h2>
    <p class="hint">Mindestens 2, maximal 5 Kategorien. Jede bekommt beim Spiel eine gewürfelte Menge.</p>
    <div id="catList"></div>
    <div class="row-btns">
      <button class="btn" id="addCat">+ Kategorie</button>
    </div>
  `;
  const list = wrap.querySelector("#catList");
  renderCatList(list);
  wrap.querySelector("#addCat").onclick = () => {
    if (S.config.categories.length >= 5) return;
    S.config.categories.push({ id: uid(), customIcon:"", text: "", multiplier:1 });
    renderCatList(list);
    updateAddRemoveButtons(wrap);
    refreshNavOnly();
  };
  updateAddRemoveButtons(wrap);
  return wrap;
}

function renderCatList(list){
  list.innerHTML = "";
  S.config.categories.forEach((cat, idx) => {
    const card = document.createElement("div");
    card.className = "cat-card";
    card.dataset.id = cat.id;
    const isCustomMult = (cat.multiplier||1) !== 1;
    card.innerHTML = `
      <div class="cat-card-row">
        <input class="cat-icon-input" type="text" maxlength="10" value="${esc(catIcon(cat))}" title="Emoji antippen zum Ändern">
        <input class="cat-text-input" type="text" maxlength="40" placeholder="z. B. Liegestütze" value="${esc(cat.text)}">
        <button class="cat-remove" title="Entfernen">✕</button>
      </div>
      ${advancedToggleHTML("mult", "Erweitert: Multiplikator" + (isCustomMult ? ` (${cat.multiplier}×)` : ""), isCustomMult)}
      <div class="field-advanced ${isCustomMult ? '' : 'hidden'}" data-role="multAdvanced">
        <span class="icon-override-label">Multiplikator (× Würfelzahl):</span>
        ${chipRowHTML([1,10,50,100], cat.multiplier||1, "×")}
      </div>
      <div class="cat-error hidden"></div>
    `;
    const input = card.querySelector(".cat-text-input");
    const iconInput = card.querySelector(".cat-icon-input");
    wireAdvancedToggle(card, "mult");
    wireChipPicker(card.querySelector('[data-role="multAdvanced"]'), () => cat.multiplier||1, (v) => { cat.multiplier = v; });
    input.oninput = () => {
      cat.text = input.value;
      if (!cat.customIcon || !cat.customIcon.trim()) iconInput.value = catIcon(cat);
      validateCatCard(card, cat);
      refreshNavOnly();
    };
    iconInput.oninput = () => {
      // store exactly what's typed, even if momentarily empty, so the user
      // can actually clear the field before typing their own emoji
      cat.customIcon = iconInput.value;
    };
    iconInput.onblur = () => {
      if (!iconInput.value.trim()){
        cat.customIcon = "";
        iconInput.value = catIcon(cat);
      }
    };
    card.querySelector(".cat-remove").onclick = () => {
      if (S.config.categories.length <= 2) return;
      S.config.categories = S.config.categories.filter(c => c.id !== cat.id);
      renderCatList(list);
      updateAddRemoveButtons(list.closest(".panel"));
      refreshNavOnly();
    };
    list.appendChild(card);
    validateCatCard(card, cat);
  });
  updateAddRemoveButtons(list.closest(".panel"));
}

function validateCatCard(card, cat){
  const input = card.querySelector(".cat-text-input");
  const errEl = card.querySelector(".cat-error");
  const text = cat.text.trim().toLowerCase();
  let msg = "";
  if (!text) msg = "Bitte eine Beschreibung eingeben.";
  else {
    const dupes = S.config.categories.filter(c => c.text.trim().toLowerCase() === text);
    if (dupes.length > 1) msg = "Dieser Name existiert schon.";
  }
  if (msg){
    input.classList.add("err"); errEl.textContent = msg; errEl.classList.remove("hidden");
  } else {
    input.classList.remove("err"); errEl.classList.add("hidden");
  }
}

function updateAddRemoveButtons(panel){
  if (!panel) return;
  const addBtn = panel.querySelector("#addCat");
  if (addBtn) addBtn.disabled = S.config.categories.length >= 5;
  panel.querySelectorAll(".cat-remove").forEach(b => b.disabled = S.config.categories.length <= 2);
}

/* ===================== CONFIG TAB 3: Glücksrad ===================== */

const FIELD_TYPE_LABELS = { time_plus:"Zeit +", time_minus:"Zeit −", amount_plus:"+X auf Kategorie", amount_minus:"−X auf Kategorie", bonus:"Bonus", handicap:"Handicap" };
const GOOD_FIELD_TYPES = ["time_plus","amount_minus","bonus"];

function buildConfigTab3(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `
    <h2>Wheel of Fortune</h2>
    <div class="toggle-row">
      <div>
        <div style="font-weight:700;font-size:14px;">Glücksrad aktivieren</div>
        <div class="hint" style="margin:2px 0 0;">Zufällige Boni & Handicaps am Ende.</div>
      </div>
      <div class="toggle ${S.config.wheelEnabled?'on':''}" id="wheelToggle"><div class="knob"></div></div>
    </div>
    <div id="wheelBody"></div>
  `;
  wrap.querySelector("#wheelToggle").onclick = () => {
    S.config.wheelEnabled = !S.config.wheelEnabled;
    wrap.querySelector("#wheelToggle").classList.toggle("on", S.config.wheelEnabled);
    renderWheelBody();
    refreshNavOnly();
  };
  const body = wrap.querySelector("#wheelBody");

  function renderWheelBody(){
    if (!S.config.wheelEnabled){ body.innerHTML = ""; return; }
    body.innerHTML = `
      <div id="fieldsList"></div>
      <div class="row-btns" style="margin-top:4px;">
        <button class="btn" id="addFieldBtn">+ Feld hinzufügen</button>
      </div>
    `;

    const fieldsList = body.querySelector("#fieldsList");
    renderFieldsList(fieldsList);

    body.querySelector("#addFieldBtn").onclick = () => {
      if (S.config.wheelFields.length >= 10) return;
      S.config.wheelFields.push({ id: uid(), type:"bonus", label:"", hours:2, amount:3, weight:1 });
      renderFieldsList(fieldsList);
      updateFieldButtons(body);
      refreshNavOnly();
    };
    updateFieldButtons(body);
  }

  function renderFieldsList(container){
    container.innerHTML = "";
    if (S.config.wheelFields.length === 0){
      container.innerHTML = `<p class="empty-msg" style="padding:6px 0 2px;">Noch keine Felder — füge unten welche hinzu.</p>`;
      return;
    }
    S.config.wheelFields.forEach(f => {
      const isTime = f.type==="time_plus" || f.type==="time_minus";
      const isAmount = f.type==="amount_plus" || f.type==="amount_minus";
      const isCustomWeight = (f.weight||1) !== 1;
      const row = document.createElement("div");
      row.className = "field-row";
      row.innerHTML = `
        <div class="field-row-top">
          <select class="type-select ${f.type}" data-role="type">
            ${Object.keys(FIELD_TYPE_LABELS).map(t => `<option value="${t}" ${t===f.type?'selected':''} style="color:${GOOD_FIELD_TYPES.includes(t)?'#3fae63':'#e0483f'};background:#181e2b;">${FIELD_TYPE_LABELS[t]}</option>`).join("")}
          </select>
          ${isTime ? `<span class="field-unit-label">${f.type==="time_plus"?"+":"−"}</span>${stepperHTML("hours", f.hours, 1, 24)}<span class="field-unit-label">h</span>`
                   : (isAmount ? ``
                   : `<input class="field-label-text" type="text" maxlength="60" placeholder="Beschreibung..." value="${esc(f.label)}" data-role="label">`)}
          <button class="field-remove">✕</button>
        </div>
        ${isAmount ? `
          <div class="field-extra" style="margin-top:8px;flex-direction:column;align-items:stretch;gap:6px;">
            <span class="icon-override-label">Menge (${f.type==="amount_plus"?"+":"−"})</span>
            ${chipRowHTML([1,3,5,10], f.amount||3, "")}
          </div>
          <div class="field-extra" style="margin-top:6px;">Beim Drehen fragt ein Popup, auf welche Kategorie es angewendet wird.</div>
        ` : ``}
        ${advancedToggleHTML("weight", "Erweitert: Gewichtung" + (isCustomWeight ? ` (${f.weight})` : ""), isCustomWeight)}
        <div class="field-advanced ${isCustomWeight ? '' : 'hidden'}" data-role="weightAdvanced">
          <span class="icon-override-label">Gewichtung (Wahrscheinlichkeit):</span>
          ${stepperHTML("weight", f.weight||1, 1, 10)}
        </div>
      `;
      row.querySelector('[data-role="type"]').onchange = e => {
        f.type = e.target.value;
        const nowTime = f.type==="time_plus" || f.type==="time_minus";
        const nowAmount = f.type==="amount_plus" || f.type==="amount_minus";
        if (nowTime && !f.hours) f.hours = 2;
        if (nowAmount && !f.amount) f.amount = 3;
        renderFieldsList(container);
        refreshNavOnly();
      };
      const labelInput = row.querySelector('[data-role="label"]');
      if (labelInput) labelInput.oninput = e => { f.label = e.target.value; refreshNavOnly(); };
      if (isTime){
        wireStepper(row, "hours", 1, 24, () => f.hours, (v) => { f.hours = v; });
      }
      if (isAmount){
        wireChipPicker(row, () => f.amount||3, (v) => { f.amount = v; });
      }
      wireAdvancedToggle(row, "weight");
      wireStepper(row, "weight", 1, 10, () => f.weight||1, (v) => { f.weight = v; });
      row.querySelector(".field-remove").onclick = () => {
        S.config.wheelFields = S.config.wheelFields.filter(x => x.id !== f.id);
        renderFieldsList(container);
        updateFieldButtons(body);
        refreshNavOnly();
      };
      container.appendChild(row);
    });
  }

  function updateFieldButtons(bodyEl){
    const addBtn = bodyEl.querySelector("#addFieldBtn");
    if (addBtn) addBtn.disabled = S.config.wheelFields.length >= 10;
  }

  renderWheelBody();
  return wrap;
}

/* ===================== GAME TAB 1: Würfeln ===================== */

let diceRolling = false;

function buildGameTab1(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `
    <h2>Würfeln</h2>
    <p class="hint">Tippe auf den Würfel, dann weise die Zahl einer Kategorie zu.</p>
    <div class="dice-stage">
      <div class="die" id="dieEl">?</div>
      <div class="die-type-tag">D${S.config.diceType}</div>
      <div class="pending-badge" id="pendingBadge"></div>
      <div class="row-btns" style="margin-top:14px;">
        <button class="btn primary" id="rollBtn">Würfeln</button>
        <button class="btn ghost small" id="resetRollsBtn">Würfel zurücksetzen</button>
      </div>
    </div>
    <div class="cat-assign-list" id="assignList"></div>
  `;
  renderAssignList(wrap);
  updatePendingBadge(wrap);

  wrap.querySelector("#rollBtn").onclick = () => rollDice(wrap);
  wrap.querySelector("#dieEl").onclick = () => rollDice(wrap);

  wrap.querySelector("#resetRollsBtn").onclick = () => {
    showConfirmModal("Alle gewürfelten Zahlen zurücksetzen? (Die Config bleibt erhalten)", () => {
      S.config.categories.forEach(c => S.game.rolls[c.id] = null);
      S.game.pendingRoll = null;
      renderAssignList(wrap);
      updatePendingBadge(wrap);
      refreshNavOnly();
    }, { danger:true, confirmText:"Zurücksetzen" });
  };

  return wrap;
}

function rollDice(wrap){
  if (diceRolling) return;
  if (S.game.pendingRoll !== null) return; // must assign first
  const remaining = S.config.categories.filter(c => S.game.rolls[c.id] === null);
  if (remaining.length === 0) return;
  diceRolling = true;
  const die = wrap.querySelector("#dieEl");
  die.classList.add("rolling");
  const rollBtn = wrap.querySelector("#rollBtn");
  rollBtn.disabled = true;
  let ticks = 0;
  const iv = setInterval(() => {
    die.textContent = String(1 + Math.floor(Math.random()*S.config.diceType));
    ticks++;
    if (ticks > 7){
      clearInterval(iv);
      const final = 1 + Math.floor(Math.random()*S.config.diceType);
      die.textContent = String(final);
      die.classList.remove("rolling");
      S.game.pendingRoll = final;
      diceRolling = false;
      renderAssignList(wrap);
      updatePendingBadge(wrap);
      rollBtn.disabled = true;
    }
  }, 70);
}

function catAmount(cat){
  const roll = S.game.rolls[cat.id];
  if (roll === null || roll === undefined) return null;
  const base = roll * (cat.multiplier || 1);
  const delta = (S.game.amountAdjustments && S.game.amountAdjustments[cat.id]) || 0;
  return Math.max(1, base + delta);
}

function catAmountBreakdown(cat){
  const roll = S.game.rolls[cat.id];
  const base = roll * (cat.multiplier || 1);
  const delta = (S.game.amountAdjustments && S.game.amountAdjustments[cat.id]) || 0;
  const final = Math.max(1, base + delta);
  return { base, delta, final };
}

function renderAssignList(wrap){
  const list = wrap.querySelector("#assignList");
  list.innerHTML = "";
  S.config.categories.forEach(cat => {
    const val = S.game.rolls[cat.id];
    const row = document.createElement("div");
    row.className = "cat-assign-row";
    const assignable = val === null && S.game.pendingRoll !== null;
    const displayVal = val !== null ? catAmount(cat) : (assignable ? "?" : "—");
    row.innerHTML = `
      <div class="cat-assign-icon">${catIcon(cat)}</div>
      <div class="cat-assign-name">${esc(cat.text)}${cat.multiplier>1 ? `<span class="mult-tag">×${cat.multiplier}</span>` : ""}</div>
      <div class="cat-assign-slot ${val!==null?'filled':''} ${assignable?'assignable':''}">${displayVal}</div>
    `;
    if (assignable){
      row.querySelector(".cat-assign-slot").onclick = () => {
        S.game.rolls[cat.id] = S.game.pendingRoll;
        S.game.pendingRoll = null;
        renderAssignList(wrap);
        updatePendingBadge(wrap);
        refreshNavOnly();
      };
    }
    list.appendChild(row);
  });
  const rollBtn = wrap.querySelector("#rollBtn");
  const remaining = S.config.categories.filter(c => S.game.rolls[c.id] === null).length;
  rollBtn.disabled = S.game.pendingRoll !== null || remaining === 0;
}

  } else {

    badge.innerHTML = remaining === 0 ? `Alle Kategorien belegt ✔` : `Bereit zum Würfeln.`;

function computeBaseHours(){
  let rawBase;
  if (S.config.timeMode === "fixed"){
    rawBase = S.config.fixedHours;
  } else {
    const sum = S.config.categories.reduce((acc,c) => acc + (S.game.rolls[c.id]||0), 0);
    rawBase = sum * getDynamicFactor();
  }
  let base = rawBase;
  let baseClampReason = null;
  if (S.config.minTimeEnabled && base < S.config.minTimeHours){ base = S.config.minTimeHours; baseClampReason = "min"; }
  if (S.config.maxTimeEnabled && base > S.config.maxTimeHours){ base = S.config.maxTimeHours; baseClampReason = "max"; }
  S.game.rawBaseHours = rawBase;
  S.game.baseHours = base;
  S.game.baseClampReason = baseClampReason;
  S.game.totalHours = base;
}

function revealFinalNumber(el, text){
  if (typeof text === "string") el.textContent = text;
  el.classList.add("reveal-num");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => el.classList.add("show"));
  });
}

function fmtHours(h){
  const r = Math.round(h*10)/10;
  return (r % 1 === 0) ? String(r) : String(r);
}

function formatDuration(hours){
  const totalMinutes = Math.max(0, Math.round(hours*60));
  const days = Math.floor(totalMinutes/1440);
  const remAfterDays = totalMinutes % 1440;
  const hrs = Math.floor(remAfterDays/60);
  const mins = remAfterDays % 60;
  const parts = [];
  if (days>0) parts.push(days+"d");
  if (hrs>0 || days>0) parts.push(hrs+"h");
  if (mins>0) parts.push(mins+"min");
  if (parts.length===0) parts.push("0min");
  return parts.join(" ");
}

function fieldDisplayLabel(f){
  if (f.type === "time_plus") return `Zeit + ${f.hours}h`;
  if (f.type === "time_minus") return `Zeit − ${f.hours}h`;
  if (f.type === "amount_plus") return `+${f.amount} auf Kategorie`;
  if (f.type === "amount_minus") return `−${f.amount} auf Kategorie`;
  return f.label || (f.type==="bonus"?"Bonus":"Handicap");
}

const WHEEL_COLORS = {
  time_plus: "#3fae63",
  time_minus: "#e0483f",
  amount_plus: "#e0483f",
  amount_minus: "#3fae63",
  bonus: "#2f8f4e",
  handicap: "#b8342c",
};

function renderWheelSVG(wrap){
  const holder = wrap.querySelector("#wheelSvgHolder");
  const pool = S.game.wheelPool;
  if (pool.length === 0){
    holder.innerHTML = `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#181e2b" stroke="#262d3d" stroke-width="2"/></svg>`;
    return;
  }
  const cx=100, cy=100, r=96;
  if (pool.length === 1){
    // a single 360° "slice" degenerates to a zero-area path (start/end points coincide) — draw a full circle instead
    const f = pool[0];
    const color = WHEEL_COLORS[f.type] || "#444";
    const label = sliceLabel(cx,cy,r,0,fieldDisplayLabel(f));
    holder.innerHTML = `<svg viewBox="0 0 200 200"><g class="rotor" id="wheelRotor" style="transform:rotate(${S.game.wheelRotationBase}deg);transform-origin:100px 100px;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#0a0d13" stroke-width="1.5" opacity="0.92"/>
      ${label}
      </g></svg>`;
    return;
  }
  const totalWeight = pool.reduce((a,f) => a+f.weight, 0);
  let angle = 0;
  let paths = "";
  let labels = "";
  pool.forEach((f, idx) => {
    const slice = (f.weight/totalWeight)*360;
    const start = angle;
    const end = angle + slice;
    paths += describeSlice(cx,cy,r,start,end, WHEEL_COLORS[f.type] || "#444", idx);
    const mid = start + slice/2;
    labels += sliceLabel(cx,cy,r, mid, fieldDisplayLabel(f));
    angle = end;
  });
  holder.innerHTML = `<svg viewBox="0 0 200 200"><g class="rotor" id="wheelRotor" style="transform:rotate(${S.game.wheelRotationBase}deg);transform-origin:100px 100px;">
    ${paths}${labels}
    </g></svg>`;
}

function polar(cx,cy,r,angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}

function describeSlice(cx,cy,r,start,end,color,idx){
  const p1 = polar(cx,cy,r,start);
  const p2 = polar(cx,cy,r,end);
  const large = (end-start) > 180 ? 1 : 0;
  return `<path d="M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${large} 1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z" fill="${color}" stroke="#0a0d13" stroke-width="1.5" opacity="0.92"/>`;
}

function sliceLabel(cx,cy,r,angleDeg,text){
  const p = polar(cx,cy,r*0.62,angleDeg);
  const short = text.length > 16 ? text.slice(0,14)+"…" : text;
  return `<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}" fill="#fff" font-size="8.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${angleDeg} ${p.x.toFixed(2)} ${p.y.toFixed(2)})">${esc(short)}</text>`;
}

let wheelSpinning = false;

function spinWheel(wrap){
  if (wheelSpinning) return;
  const pool = S.game.wheelPool;
  if (pool.length === 0) return;
  wheelSpinning = true;
  wrap.querySelector("#spinBtn").disabled = true;
  wrap.querySelector("#wheelResultBanner").textContent = "";

  const totalWeight = pool.reduce((a,f) => a+f.weight, 0);
  let r = Math.random()*totalWeight;
  let winner = pool[0];
  let cum = 0;
  let winnerMid = 0;
  let angle = 0;
  for (const f of pool){
    const slice = (f.weight/totalWeight)*360;
    if (r <= cum+slice){ winner = f; winnerMid = angle + slice/2; break; }
    cum += slice; angle += slice;
  }

  const rotor = wrap.querySelector("#wheelRotor");
  const spins = 5;
  const targetRotation = spins*360 + (360 - winnerMid) % 360;
  rotor.style.transition = "transform 2.4s cubic-bezier(.17,.67,.16,1)";
  requestAnimationFrame(() => {
    rotor.style.transform = `rotate(${targetRotation}deg) `;
    rotor.style.transformOrigin = "100px 100px";
  });

  const onDone = () => {
    rotor.removeEventListener("transitionend", onDone);
    S.game.wheelPool = S.game.wheelPool.filter(f => f.id !== winner.id);
    S.game.hasSpunOnce = true;
    // snap back instantly for next spin
    rotor.style.transition = "none";
    S.game.wheelRotationBase = 0;
    wheelSpinning = false;

    const finishSpin = () => {
      renderTabContent();
      renderBottomNav();
      renderStepNav();
    };

    if (winner.type === "amount_plus" || winner.type === "amount_minus"){
      showCategoryPickerModal(winner, (categoryId) => {
        applyAmountResult(winner, categoryId);
        finishSpin();
      });
    } else {
      applyWheelResult(winner);
      finishSpin();
    }
  };
  rotor.addEventListener("transitionend", onDone);
}

function showCategoryPickerModal(field, onPick){
  const root = document.getElementById("modalRoot");
  const isPlus = field.type === "amount_plus";
  const headline = (isPlus ? "+" : "−") + field.amount;
  const rows = S.config.categories.map(c => `
    <button class="cat-pick-row" data-id="${c.id}">
      <span class="cat-pick-icon">${catIcon(c)}</span>
      <span class="cat-pick-name">${esc(c.text)}</span>
      <span class="cat-pick-val">${catAmount(c)}</span>
    </button>
  `).join("");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box modal-box-small">
        <h2 style="margin-bottom:12px;">${esc(headline)}</h2>
        <div class="cat-pick-list">${rows}</div>
      </div>
    </div>
  `;
  root.querySelectorAll(".cat-pick-row").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      root.innerHTML = "";
      onPick(id);
    };
  });
}

function applyAmountResult(field, categoryId){
  const cat = S.config.categories.find(c => c.id === categoryId);
  const delta = field.type === "amount_plus" ? field.amount : -field.amount;
  if (!S.game.amountAdjustments) S.game.amountAdjustments = {};
  S.game.amountAdjustments[categoryId] = (S.game.amountAdjustments[categoryId] || 0) + delta;
  const sign = field.type === "amount_plus" ? "+" : "−";
  const label = `${sign}${field.amount} → ${cat ? catIcon(cat) : ""} ${cat ? cat.text : ""}`.trim();
  S.game.wheelResults.push({ type: field.type, label, amt: `${sign}${field.amount}` });
}

function applyWheelResult(field){
  const label = fieldDisplayLabel(field);
  let amt = "";
  if (field.type === "time_plus" || field.type === "time_minus"){
    const delta = field.type === "time_plus" ? field.hours : -field.hours;
    const before = S.game.totalHours;
    let after = before + delta;
    let clampReason = null;
    if (S.config.minTimeEnabled && after < S.config.minTimeHours){ after = S.config.minTimeHours; clampReason = "min"; }
    if (S.config.maxTimeEnabled && after > S.config.maxTimeHours){ after = S.config.maxTimeHours; clampReason = "max"; }
    S.game.totalHours = after;
    S.game.timeLog.push({ label, delta: after-before, clampReason });
    amt = `${field.type==="time_plus"?"+":"−"}${fmtHours(field.hours)}h`;
  }
  S.game.wheelResults.push({ type: field.type, label, amt });
}

function renderResultList(wrap){
  const list = wrap.querySelector("#resultList");
  if (!list) return;
  list.innerHTML = "";
  S.game.wheelResults.forEach(r => {
    const row = document.createElement("div");
    row.className = `result-row ${r.type}`;
    const amt = r.amt ? `<span class="amt">${r.amt}</span>` : "";
    row.innerHTML = `<span>${esc(r.label)}</span>${amt}`;
    list.appendChild(row);
  });
}

/* ===================== PNG EXPORT ===================== */

function loadHtml2Canvas(cb, onError){
  if (window.html2canvas) { cb(); return; }
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  s.onload = cb;
  s.onerror = () => onError("Bild-Export konnte nicht geladen werden (keine Internetverbindung?).");
  document.head.appendChild(s);
}

function exportSummaryAsPng(captureEl, btnEl){
  const originalLabel = btnEl ? btnEl.textContent : "";
  if (btnEl){ btnEl.disabled = true; btnEl.textContent = "Bild wird erstellt…"; }
  const resetBtn = () => { if (btnEl){ btnEl.disabled = false; btnEl.textContent = originalLabel; } };

  // make sure any still-animating "reveal" numbers are fully visible in the export,
  // bypassing the transition entirely so timing can't leave it mid-fade/blur
  captureEl.querySelectorAll(".reveal-num").forEach(el => {
    el.style.transition = "none";
    el.style.opacity = "1";
    el.style.filter = "none";
    el.style.transform = "none";
  });

  loadHtml2Canvas(() => {
    const rect = captureEl.getBoundingClientRect();
    const fullWidth = Math.ceil(captureEl.scrollWidth);
    const fullHeight = Math.ceil(captureEl.scrollHeight);
    window.html2canvas(captureEl, {
      backgroundColor: "#141924",
      scale: Math.min(2, window.devicePixelRatio || 1.5),
      width: fullWidth,
      height: fullHeight,
      windowWidth: fullWidth,
      windowHeight: fullHeight,
      x: 0,
      y: 0,
      scrollX: 0,
      scrollY: 0,
      useCORS: true,
    })
      .then(canvas => {
        canvas.toBlob(async (blob) => {
          if (!blob){ resetBtn(); showAlertModal("Bild konnte nicht erstellt werden."); return; }
          const file = new File([blob], "verlierer-bestrafung.png", { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files:[file] })){
            try {
              await navigator.share({ files:[file], title:"Verlierer-Bestrafung" });
              resetBtn();
              return;
            } catch(shareErr){
              if (shareErr && shareErr.name === "AbortError"){ resetBtn(); return; }
              // fall through to download if share fails for another reason
            }
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = "verlierer-bestrafung.png";
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          resetBtn();
        }, "image/png");
      })
      .catch(err => {
        resetBtn();
        showAlertModal("Bild-Export fehlgeschlagen: " + (err && err.message ? err.message : "Unbekannter Fehler"));
      });
  }, (msg) => { resetBtn(); showAlertModal(msg); });
}

/* ===================== CONFETTI ===================== */

function fireDoomEffect(panelEl){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  // brief crimson vignette flash
  const flash = document.createElement("div");
  flash.className = "doom-flash";
  document.body.appendChild(flash);
  requestAnimationFrame(() => flash.classList.add("show"));
  setTimeout(() => flash.classList.remove("show"), 220);
  setTimeout(() => flash.remove(), 700);

  // subtle screen shake on the summary panel
  if (panelEl){
    panelEl.classList.add("doom-shake");
    setTimeout(() => panelEl.classList.remove("doom-shake"), 420);
  }

  // rising embers
  const canvas = document.getElementById("fxCanvas");
  canvas.classList.remove("hidden");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ff6a1a","#e0483f","#c8203c","#ff9a3c"];
  const embers = [];
  for (let i=0;i<55;i++){
    embers.push({
      x: Math.random()*canvas.width,
      y: canvas.height + Math.random()*80,
      r: 1.5+Math.random()*2.5,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: -(0.6+Math.random()*1.4),
      vx: -0.4+Math.random()*0.8,
      sway: Math.random()*Math.PI*2,
      swaySpeed: 0.02+Math.random()*0.03,
      life: 0,
      maxLife: 140+Math.random()*100,
    });
  }
  let frame = 0;
  const maxFrames = 220;
  function loop(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    embers.forEach(p => {
      p.life++;
      p.sway += p.swaySpeed;
      p.x += p.vx + Math.sin(p.sway)*0.6;
      p.y += p.vy;
      const lifeRatio = p.life / p.maxLife;
      const alpha = Math.max(0, 1 - lifeRatio) * (0.5+0.5*Math.sin(p.life*0.3));
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    if (frame < maxFrames){
      requestAnimationFrame(loop);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.classList.add("hidden");
    }
  }
  loop();
}

/* ===================== TOAST ===================== */

let toastTimer = null;
function showToast(message){
  if (!message) return;
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.classList.add("hidden"), 250);
  }, 2600);
}

/* ===================== GENERIC CONFIRM / ALERT MODAL ===================== */

function showConfirmModal(message, onConfirm, opts={}){
  const root = document.getElementById("modalRoot");
  const danger = !!opts.danger;
  const cancelText = opts.cancelText || "Abbrechen";
  const confirmText = opts.confirmText || "Bestätigen";
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box modal-box-small">
        <p class="modal-message">${esc(message)}</p>
        <div class="row-btns" style="margin-top:16px;">
          <button class="btn ghost full" id="modalCancelBtn">${esc(cancelText)}</button>
          <button class="btn full ${danger?'danger-btn':'primary'}" id="modalConfirmBtn">${esc(confirmText)}</button>
        </div>
      </div>
    </div>
  `;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("modalOverlay").onclick = (e) => { if (e.target.id==="modalOverlay") close(); };
  document.getElementById("modalCancelBtn").onclick = close;
  document.getElementById("modalConfirmBtn").onclick = () => { close(); onConfirm(); };
}

function showAlertModal(message){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box modal-box-small">
        <p class="modal-message">${esc(message)}</p>
        <div class="row-btns" style="margin-top:16px;">
          <button class="btn primary full" id="modalOkBtn">OK</button>
        </div>
      </div>
    </div>
  `;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("modalOverlay").onclick = (e) => { if (e.target.id==="modalOverlay") close(); };
  document.getElementById("modalOkBtn").onclick = close;
}

/* ===================== HELP MODAL ===================== */

function showHelpModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h2>Wie funktioniert's?</h2>
        <p><strong>Config:</strong> Aufgaben festlegen, Würfeltyp wählen, Zeitmodus einstellen, optional das Glücksrad konfigurieren.</p>
        <ul>
          <li>Jede Aufgabe bekommt beim Spiel eine gewürfelte Menge.</li>
          <li>Feste Zeit = fixe Stundenzahl. Dynamische Zeit = Summe der Würfe × Faktor.</li>
          <li>Das Glücksrad kann die Zeit erhöhen/senken oder Boni & Handicaps geben.</li>
        </ul>
        <p><strong>Spiel:</strong> Würfeln → Zeit ansehen → Glücksrad drehen (optional) → Zusammenfassung mit Bild-Export.</p>
        <p>Alles bleibt nur im Speicher – ein Reload setzt alles zurück.</p>
        <button class="btn full" id="closeModalBtn" style="margin-top:10px;">Verstanden</button>
      </div>
    </div>
  `;
  document.getElementById("modalOverlay").onclick = (e) => { if (e.target.id==="modalOverlay") root.innerHTML=""; };
  document.getElementById("closeModalBtn").onclick = () => root.innerHTML = "";
}

/* ===================== INIT ===================== */

window.addEventListener("beforeunload", (e) => {
  const hasProgress = S.page === "game" || S.configTab > 1;
  if (hasProgress){
    e.preventDefault();
    e.returnValue = "";
  }
});

render();

})();
</script>
