<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Würfeln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #1b4332;
    --felt-dark: #143026;
    --ivory: #f4efe3;
    --gold: #c99a3f;
    --gold-soft: #dfc07f;
    --pip: #a53d33;
    --wood: #7a5236;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Work Sans', sans-serif;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      var(--felt);
    background-color: var(--felt);
    color: var(--ivory);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 8vw, 2.8rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: -18px 0 0;
    font-size: 0.95rem;
    color: var(--gold-soft);
  }

  .scene {
    width: 140px;
    height: 140px;
    perspective: 800px;
    margin: 12px 0;
  }

  .die {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-18deg) rotateY(28deg);
    transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }

  .die:active { filter: brightness(0.97); }

  .face {
    position: absolute;
    width: 140px;
    height: 140px;
    background: linear-gradient(155deg, var(--ivory), #e7dfc9);
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 22px;
  }

  .pip {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--pip);
    justify-self: center;
    align-self: center;
    opacity: 0;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.25);
  }

  .face-front  { transform: translateZ(70px); }
  .face-back   { transform: rotateY(180deg) translateZ(70px); }
  .face-right  { transform: rotateY(90deg) translateZ(70px); }
  .face-left   { transform: rotateY(-90deg) translateZ(70px); }
  .face-top    { transform: rotateX(90deg) translateZ(70px); }
  .face-bottom { transform: rotateX(-90deg) translateZ(70px); }

  .face[data-value="1"] .pip:nth-child(5) { opacity: 1; }

  .face[data-value="2"] .pip:nth-child(1),
  .face[data-value="2"] .pip:nth-child(9) { opacity: 1; }

  .face[data-value="3"] .pip:nth-child(1),
  .face[data-value="3"] .pip:nth-child(5),
  .face[data-value="3"] .pip:nth-child(9) { opacity: 1; }

  .face[data-value="4"] .pip:nth-child(1),
  .face[data-value="4"] .pip:nth-child(3),
  .face[data-value="4"] .pip:nth-child(7),
  .face[data-value="4"] .pip:nth-child(9) { opacity: 1; }

  .face[data-value="5"] .pip:nth-child(1),
  .face[data-value="5"] .pip:nth-child(3),
  .face[data-value="5"] .pip:nth-child(5),
  .face[data-value="5"] .pip:nth-child(7),
  .face[data-value="5"] .pip:nth-child(9) { opacity: 1; }

  .face[data-value="6"] .pip:nth-child(1),
  .face[data-value="6"] .pip:nth-child(3),
  .face[data-value="6"] .pip:nth-child(4),
  .face[data-value="6"] .pip:nth-child(6),
  .face[data-value="6"] .pip:nth-child(7),
  .face[data-value="6"] .pip:nth-child(9) { opacity: 1; }

  .result {
    font-size: 1.05rem;
    min-height: 1.4em;
  }

  .result strong {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--gold-soft);
  }

  button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--felt-dark);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  button:hover { background: var(--gold-soft); }
  button:active { transform: scale(0.96); }

  .history {
    display: flex;
    gap: 8px;
    min-height: 12px;
  }

  .history span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(244, 239, 227, 0.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .die { transition: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div>
      <h1>Würfeln</h1>
      <p class="sub">Ein Wurf, ein Zufall.</p>
    </div>

    <div class="scene">
      <div class="die" id="die" role="button" tabindex="0" aria-label="Würfel werfen">
        <div class="face face-front"  data-value="1"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div class="face face-back"   data-value="6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div class="face face-right"  data-value="3"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div class="face face-left"   data-value="4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div class="face face-top"    data-value="2"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
        <div class="face face-bottom" data-value="5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
      </div>
    </div>

    <p class="result" id="result" aria-live="polite">Tippe auf den Würfel oder den Knopf.</p>

    <button id="rollBtn">Würfeln</button>

    <div class="history" id="history"></div>
  </div>

<script>
  const die = document.getElementById('die');
  const result = document.getElementById('result');
  const rollBtn = document.getElementById('rollBtn');
  const history = document.getElementById('history');

  // Zielrotation, um jeweils diese Zahl nach vorne zu drehen
  const targets = {
    1: { x: 0,   y: 0   },
    6: { x: 0,   y: 180 },
    3: { x: 0,   y: -90 },
    4: { x: 0,   y: 90  },
    2: { x: -90, y: 0   },
    5: { x: 90,  y: 0   },
  };

  let currentX = -18;
  let currentY = 28;
  let rolling = false;
  const rolls = [];

  function roll() {
    if (rolling) return;
    rolling = true;
    rollBtn.disabled = true;

    const value = Math.floor(Math.random() * 6) + 1;
    const target = targets[value];

    // ein paar zusätzliche volle Umdrehungen für den Schwung
    const extraX = (2 + Math.floor(Math.random() * 2)) * 360;
    const extraY = (2 + Math.floor(Math.random() * 2)) * 360;

    currentX = target.x + extraX * (Math.random() < 0.5 ? 1 : -1);
    currentY = target.y + extraY * (Math.random() < 0.5 ? 1 : -1);

    die.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

    setTimeout(() => {
      result.innerHTML = `Du hast eine <strong>${value}</strong> gewürfelt.`;
      rolls.push(value);
      renderHistory();
      rolling = false;
      rollBtn.disabled = false;
    }, 1100);
  }

  function renderHistory() {
    history.innerHTML = '';
    rolls.slice(-5).forEach(() => {
      const dot = document.createElement('span');
      history.appendChild(dot);
    });
  }

  die.addEventListener('click', roll);
  die.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); roll(); }
  });
  rollBtn.addEventListener('click', roll);
</script>

</body>
</html>
