<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>You lost! 😈🏈</title>
<style>
  :root{
    --bg:#0a0d13;
    --bg-alt:#0d1119;
    --panel:#141924;
    --panel-2:#181e2b;
    --border:#262d3d;
    --text:#eef1f6;
    --muted:#8892a3;
    --muted-2:#5b6376;
    --crimson:#c8203c;
    --crimson-dim:#7d1526;
    --crimson-glow:#e63a58;
    --violet:#7a3fc0;
    --gold:#d7a92e;
    --green:#3fae63;
    --green-dim:#1f3f2b;
    --red-bad:#e0483f;
    --red-dim:#3f201f;
    --focus:#f2c14e;
    --radius:6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1420 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:96px;
  }
  button{font-family:inherit;cursor:pointer;}
  input, select{font-family:inherit;}
  ::selection{background:var(--crimson-dim);color:#fff;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .app{max-width:480px;margin:0 auto;padding:0 16px;}
  @media (min-width:640px){ .app{max-width:640px;padding:0 24px;} }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 0 14px;
    text-align:center;
  }
  .logo-row{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:34px;line-height:1;margin-bottom:6px;
  }
  h1.title{
    font-size:32px;font-weight:800;letter-spacing:-0.02em;margin:0;
    color:var(--crimson-glow);text-transform: uppercase;
  }
  .subtitle{
    color:var(--muted);font-size:15px;margin-top:4px;font-weight: 500;
  }
  .laces{
    width:120px;height:10px;margin:14px auto 0;opacity:.55;
  }

  .reload-note{
    text-align:center;font-size:11.5px;color:var(--muted-2);
    margin-top:10px;padding:0 20px;
  }

  /* ---------- top action bar ---------- */
  .topbar-actions{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin:10px 0 4px;
  }
  .link-btn{
    background:none;border:none;color:var(--muted);font-size:13px;
    padding:6px 4px;text-decoration:underline;text-decoration-color:var(--border);
  }
  .link-btn:hover{color:var(--text);}
  .link-btn.danger{color:#d98a8a;}
  .link-btn.danger:hover{color:var(--red-bad);}
  .help-btn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-2);color:var(--muted);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none;
  }

  /* ---------- step nav ---------- */
  .stepnav{margin:18px 0 6px;}
  .stepnav-row{display:flex;align-items:center;}
  .step-chip-wrap{display:flex;flex-direction:column;align-items:center;flex:none;position:relative;}
  .step-chip{
    width:30px;height:30px;border-radius:50%;
    border:2px solid var(--border);background:var(--panel);
    color:var(--muted);font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,color .15s;
  }
  .step-chip.reachable{cursor:pointer;}
  .step-chip.done{background:var(--crimson-dim);border-color:var(--crimson);color:#fff;}
  .step-chip.current{background:var(--crimson);border-color:var(--crimson-glow);color:#fff;box-shadow:0 0 0 3px rgba(200,32,60,.22);}
  .step-label{font-size:10.5px;color:var(--muted-2);margin-top:5px;max-width:64px;text-align:center;line-height:1.2;}
  .step-chip-wrap.current .step-label{color:var(--muted);}
  .step-line{flex:1;height:2px;background:var(--border);margin:0 2px;position:relative;top:-14px;}
  .step-line.filled{background:var(--crimson-dim);}

  .down-caption{
    text-align:center;font-size:12px;color:var(--muted-2);margin:10px 0 0;
    font-style:italic;
  }

  /* ---------- panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px;
    margin-top:16px;
    position:relative;
  }
  .panel::before, .panel::after{
    content:"";position:absolute;width:14px;height:14px;
    border-color:var(--crimson-dim);opacity:.6;
  }
  .panel::before{top:-1px;left:-1px;border-top:2px solid var(--crimson-dim);border-left:2px solid var(--crimson-dim);}
  .panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--crimson-dim);border-right:2px solid var(--crimson-dim);}

  .panel h2{
    font-size:16px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;
  }
  .panel p.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.4;}

  /* ---------- category cards ---------- */
  .cat-card{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;
  }
  .cat-card-row{display:flex;gap:10px;align-items:flex-start;}
  .cat-icon-input{
    width:46px;height:40px;border-radius:var(--radius);background:var(--bg-alt);
    color: var(--text); text-align: center; font-size: 20px;
    border:1px solid var(--border);
  }
  .cat-text-input{
    flex:1;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px 12px;font-size:14px;min-width:0;
  }
  .cat-text-input.err{border-color:var(--red-bad);}
  .cat-remove{
    flex:none;width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg-alt);color:var(--muted);font-size:16px;
  }
  .cat-remove:disabled{opacity:.35;cursor:not-allowed;}
  .cat-error{color:var(--red-bad);font-size:11.5px;margin-top:6px;}
  .row-btns{display:flex;gap:10px;margin-top:12px;}
  .btn{
    border-radius:var(--radius);border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);padding:10px 16px;font-size:13.5px;font-weight:600;
  }
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--crimson);border-color:var(--crimson-glow);color:#fff;}
  .btn.primary:disabled{background:var(--panel-2);border-color:var(--border);color:var(--muted);}
  .btn.ghost{background:transparent;}
  .btn.full{width:100%;}
  .btn.small{padding:7px 12px;font-size:12.5px;}

  /* ---------- choice grid / dice ---------- */
  .choice-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .choice-btn{
    position: relative;
    border-radius:var(--radius);border:1px solid var(--border);background:var(--panel-2);
    color:var(--text);padding:12px 0;font-size:14px;font-weight:700;flex:1;min-width:52px;text-align:center;
  }
  .choice-btn.active{border-color:var(--crimson);background:var(--crimson-dim);color:#fff;}
  .recommended-badge{
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #000; font-size: 8px; padding: 2px 4px;
    border-radius: 4px; text-transform: uppercase; white-space: nowrap;
  }

  /* ---------- generic form bits ---------- */
  .field-label{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:block;font-weight:600;}
  .num-input{
    background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px 12px;font-size:15px;width:100%;
  }

  /* Slider Styling */
  .slider-wrap{margin: 20px 0;}
  .slider-labels{display: flex; justify-content: space-between; margin-top: 10px;}
  .slider-labels span{font-size: 10px; color: var(--muted-2); width: 20%; text-align: center;}
  .slider-labels span.active{color: var(--gold); font-weight: bold;}
  input[type=range] { width: 100%; accent-color: var(--crimson); cursor: pointer; }

  .radio-row{display:flex;gap:10px;margin-bottom:14px;}
  .radio-opt{
    flex:1;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel-2);
    padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--muted);
  }
  .radio-opt.active{border-color:var(--crimson);background:var(--crimson-dim);color:#fff;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .toggle{
    width:44px;height:26px;border-radius:14px;background:var(--border);position:relative;flex:none;
    border:1px solid var(--border);
  }
  .toggle.on{background:var(--crimson-dim);border-color:var(--crimson);}
  .toggle .knob{
    width:20px;height:20px;border-radius:50%;background:#c9cdd6;position:absolute;top:2px;left:2px;
    transition:left .15s;
  }
  .toggle.on .knob{left:22px;background:#fff;}

  .field-row{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;
  }
  .field-row-top{display:flex;align-items:center;gap:8px;}
  .type-badge{
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;flex:none;
  }
  .type-badge.time_plus{background:var(--green-dim);color:var(--green);}
  .type-badge.time_minus{background:var(--red-dim);color:var(--red-bad);}
  .type-badge.bonus{background:var(--green-dim);color:var(--green);}
  .type-badge.handicap{background:var(--red-dim);color:var(--red-bad);}
  .field-label-text{flex:1;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:8px 10px;font-size:13.5px;min-width:0;}
  .field-mini-input{width:56px;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:8px 6px;font-size:13px;text-align:center;flex:none;}
  .field-remove{flex:none;width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg-alt);color:var(--muted);font-size:14px;}
  .field-extra{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .add-field-row{display:flex;gap:8px;margin-top:12px;}
  .add-field-row select{flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:9px;font-size:13px;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(10,13,19,0) 0%, rgba(10,13,19,.97) 30%);
    padding:18px 16px 16px;
    display:flex;justify-content:center;
    z-index: 100;
  }
  .bottomnav-inner{
    max-width:480px;width:100%;display:flex;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px;
  }
  @media (min-width:640px){ .bottomnav-inner{max-width:640px;} }
  .bottomnav-inner .btn{flex:1;}

  /* ---------- dice ---------- */
  .dice-stage{display:flex;flex-direction:column;align-items:center;padding:10px 0 18px;}
  .die{
    width:86px;height:86px;border-radius:14px;
    background:linear-gradient(145deg,#1c2230,#12161f);
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:900;color:var(--text);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .die.rolling{animation:diceshake .55s ease-in-out;}
  @keyframes diceshake{
    0%{transform:rotate(0deg) scale(1);}
    25%{transform:rotate(-14deg) scale(1.04);}
    50%{transform:rotate(10deg) scale(0.98);}
    75%{transform:rotate(-6deg) scale(1.03);}
    100%{transform:rotate(0deg) scale(1);}
  }
  .die-type-tag{color:var(--muted);font-size:12px;margin-top:10px;font-weight:600;}
  .pending-badge{
    margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center;min-height:18px;
  }
  .pending-badge strong{color:var(--gold);font-size:15px;}

  .cat-assign-list{margin-top:6px;}
  .cat-assign-row{
    display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);
  }
  .cat-assign-row:last-child{border-bottom:none;}
  .cat-assign-icon{font-size:20px;width:28px;text-align:center;flex:none;}
  .cat-assign-name{flex:1;font-size:14px;}
  .cat-assign-slot{
    width:44px;height:36px;border-radius:var(--radius);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
    color:var(--muted-2);flex:none;
  }
  .cat-assign-slot.filled{border-style:solid;border-color:var(--crimson);color:#fff;background:var(--crimson-dim);}
  .cat-assign-slot.assignable{border-color:var(--gold);color:var(--gold);cursor:pointer;}

  /* ---------- time tab ---------- */
  .time-hero{text-align:center;padding:26px 0 8px;}
  .time-hero .big-num{font-size:56px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}
  .time-hero .unit{font-size:15px;color:var(--muted);margin-top:2px;}
  .sum-visual{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .sum-chip{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:8px 12px;font-weight:800;font-size:15px;color:var(--text);
    opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;
  }
  .sum-chip.show{opacity:1;transform:translateY(0);}
  .sum-op{color:var(--muted-2);font-size:15px;align-self:center;}

  /* ---------- wheel ---------- */
  .wheel-stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 10px;}
  .wheel-wrap{position:relative;width:250px;height:250px;}
  .wheel-pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:18px solid var(--gold);z-index:2;
  }
  .wheel-svg-holder{width:100%;height:100%;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 6px var(--panel-2), 0 0 0 8px var(--border), 0 10px 30px rgba(0,0,0,.5);}
  .wheel-svg-holder svg{display:block;width:100%;height:100%;}
  .wheel-svg-holder svg g.rotor{transition:transform 2.4s cubic-bezier(.17,.67,.16,1);}
  .wheel-center-dot{
    position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;
    background:var(--panel);border:2px solid var(--border);transform:translate(-50%,-50%);z-index:2;
  }
  .wheel-result-banner{
    margin-top:16px;text-align:center;font-size:14px;min-height:20px;font-weight:700;
  }
  .wheel-empty-msg{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 0;}
  .result-list{margin-top:16px;}
  .result-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:13.5px;font-weight:600;
  }
  .result-row.bonus, .result-row.time_plus{background:var(--green-dim);color:var(--green);}
  .result-row.handicap, .result-row.time_minus{background:var(--red-dim);color:var(--red-bad);}
  .result-row .amt{font-weight:800;font-variant-numeric:tabular-nums;}

  /* ---------- summary ---------- */
  .summary-block{margin-top:6px;}
  .summary-block h3{font-size:13px;color:var(--muted);margin:18px 0 8px;font-weight:700;text-transform:none;}
  .summary-cat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .summary-cat-row:last-child{border-bottom:none;}
  .summary-derivation{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;font-size:13px;color:var(--muted);line-height:1.7;
  }
  .summary-derivation .final{color:var(--gold);font-weight:800;font-size:15px;}
  .final-hero{text-align:center;padding:8px 0 4px;}
  .final-hero .big-num{font-size:60px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}

  /* ---------- misc ---------- */
  .empty-msg{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:200;
  }
  .modal-box{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    max-width:420px;width:100%;padding:20px;max-height:80vh;overflow-y:auto;
  }
  .hidden{display:none !important;}
  .confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:150;}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="logo-row">😈🏈</div>
    <h1 class="title">You lost!</h1>
    <div class="subtitle">Hier entscheidet sich dein Schicksal</div>
    <svg class="laces" viewBox="0 0 120 10"><g stroke="#c8203c" stroke-width="1.4">
      <line x1="5" y1="1" x2="5" y2="9"/><line x1="20" y1="1" x2="20" y2="9"/>
      <line x1="35" y1="1" x2="35" y2="9"/><line x1="50" y1="1" x2="50" y2="9"/>
      <line x1="65" y1="1" x2="65" y2="9"/><line x1="80" y1="1" x2="80" y2="9"/>
      <line x1="95" y1="1" x2="95" y2="9"/><line x1="110" y1="1" x2="110" y2="9"/>
      <line x1="0" y1="5" x2="120" y2="5" stroke-width="1"/>
    </g></svg>
    <div class="reload-note">⚠️ Beim Neuladen der Seite gehen alle Eingaben verloren.</div>
  </header>

  <div class="topbar-actions" id="topbarActions"></div>

  <div class="stepnav" id="stepNav"></div>
  <div class="down-caption" id="downCaption"></div>

  <div id="tabContent"></div>
</div>

<div class="bottomnav">
  <div class="bottomnav-inner" id="bottomNav"></div>
</div>

<div id="modalRoot"></div>
<canvas class="confetti-canvas hidden" id="confettiCanvas"></canvas>

<script>
(function(){
"use strict";

/* ===================== STATE ===================== */

function uid(){ return 'id' + Math.random().toString(36).slice(2,9); }
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const SLIDER_STEPS = [
  { label: "Tutorial", factor: 1.2 },
  { label: "Casual", factor: 1.1 },
  { label: "Normal", factor: 1.0 },
  { label: "Hard", factor: 0.9 },
  { label: "Impossible", factor: 0.8 }
];

function defaultConfig(){
  return {
    categories: [
      { id: uid(), icon:"🍺", text:"Bier trinken" },
      { id: uid(), icon:"🏃", text:"km laufen" },
      { id: uid(), icon:"🌭", text:"Hotdogs essen" },
    ],
    diceType: null,
    timeMode: "fixed",
    fixedHours: 24,
    dynamicFactorIdx: 2, // Normal
    minTotalHours: 0,
    wheelEnabled: false,
    wheelFields: [],
  };
}

const S = {
  page: "config",
  config: defaultConfig(),
  configTab: 1,
  maxReachedConfigTab: 1,
  game: null,
  gameTab: 1,
  maxReachedGameTab: 1,
};

function freshGame(){
  const rolls = {};
  S.config.categories.forEach(c => rolls[c.id] = null);
  return {
    rolls,
    pendingRoll: null,
    rollsMade: 0,
    baseHours: null,
    totalHours: null,
    timeLog: [],
    wheelPool: JSON.parse(JSON.stringify(S.config.wheelFields)),
    wheelResults: [],
    wheelRotationBase: 0,
    confettiFired: false,
    hasSpun: false,
  };
}

/* ===================== VALIDATION ===================== */

function configTab1Valid(){
  return S.config.categories.length >= 2 && S.config.categories.every(c => c.text.trim().length > 0);
}
function configTab2Valid(){ return S.config.diceType !== null; }
function configTab3Valid(){ return true; }
function configTab4Valid(){ return true; }

function configTabValid(n){
  return [null, configTab1Valid, configTab2Valid, configTab3Valid, configTab4Valid][n]();
}

function gameTab1Valid(){ return S.config.categories.every(c => S.game.rolls[c.id] !== null); }
function gameTabValid(n){ return [null, gameTab1Valid, ()=>true, ()=> (S.game.hasSpun || !S.config.wheelEnabled), ()=>true][n](); }

/* ===================== RENDER SHELL ===================== */

function render(){
  renderTopbar();
  renderStepNav();
  renderTabContent();
  renderBottomNav();
}

function renderTopbar(){
  const el = document.getElementById("topbarActions");
  if (S.page === "config"){
    el.innerHTML = `<button class="link-btn danger" id="btnResetAll">Reset All</button>`;
  } else {
    el.innerHTML = `<button class="link-btn" id="btnBackToConfig">← Zurück zur Config</button>`;
  }
  const resetBtn = document.getElementById("btnResetAll");
  if (resetBtn) resetBtn.onclick = () => { if(confirm("Alles zurücksetzen?")) { S.config = defaultConfig(); S.page="config"; S.configTab=1; render(); } };
  const backBtn = document.getElementById("btnBackToConfig");
  if (backBtn) backBtn.onclick = () => { S.page = "config"; render(); };
}

function renderStepNav(){
  const nav = document.getElementById("stepNav");
  const labels = S.page === "config" ? ["Aufgaben","Würfel","Zeit","Wheel"] : ["Würfeln","Zeit","Wheel","Ende"];
  const current = S.page === "config" ? S.configTab : S.gameTab;
  const maxReached = S.page === "config" ? S.maxReachedConfigTab : S.maxReachedGameTab;

  let html = '<div class="stepnav-row">';
  labels.forEach((label, i) => {
    const n = i+1;
    const reachable = n <= maxReached;
    let cls = "step-chip";
    if (n < current) cls += " done";
    if (n === current) cls += " current";
    if (reachable) cls += " reachable";
    html += `<div class="step-chip-wrap ${n===current?'current':''}">
      <div class="${cls}" data-step="${n}">${n < current ? '✓' : n}</div>
      <div class="step-label">${label}</div>
    </div>`;
    if (i < labels.length-1) html += `<div class="step-line ${n < current ? 'filled':''}"></div>`;
  });
  nav.innerHTML = html + '</div>';
  document.getElementById("downCaption").textContent = `🏈 ${["1st Down","2nd Down","3rd Down","4th Down"][current-1]}`;

  nav.querySelectorAll(".step-chip.reachable").forEach(chip => {
    chip.onclick = () => {
      const n = parseInt(chip.dataset.step, 10);
      if (S.page === "config") S.configTab = n; else S.gameTab = n;
      render();
    };
  });
}

function renderBottomNav(){
  const el = document.getElementById("bottomNav");
  const isConfig = S.page === "config";
  const tab = isConfig ? S.configTab : S.gameTab;
  const valid = isConfig ? configTabValid(tab) : gameTabValid(tab);

  let nextLabel = "Weiter →";
  if (isConfig && tab === 4) nextLabel = "Let's Roll! 🏈";
  if (!isConfig && tab === 3) nextLabel = "Get me out";

  el.innerHTML = `
    <button class="btn ghost" id="navBack" ${tab===1?'disabled':''}>← Zurück</button>
    ${tab < 4 || (isConfig && tab === 4) ? `<button class="btn primary" id="navNext" ${valid?'':'disabled'}>${nextLabel}</button>` : ''}
  `;

  document.getElementById("navBack").onclick = () => {
    if (isConfig) { S.configTab--; render(); }
    else { S.gameTab--; render(); }
  };
  const next = document.getElementById("navNext");
  if (next) next.onclick = () => {
    if (isConfig) {
      if (tab < 4) { S.configTab++; S.maxReachedConfigTab = Math.max(S.maxReachedConfigTab, S.configTab); render(); }
      else { S.game = freshGame(); S.page = "game"; S.gameTab = 1; S.maxReachedGameTab = 1; render(); }
    } else {
      if (S.gameTab === 1 && S.game.baseHours === null) computeBaseHours();
      S.gameTab++; S.maxReachedGameTab = Math.max(S.maxReachedGameTab, S.gameTab); render();
    }
  };
}

function renderTabContent(){
  const el = document.getElementById("tabContent");
  el.innerHTML = "";
  if (S.page === "config"){
    if (S.configTab===1) el.appendChild(buildConfigTab1());
    if (S.configTab===2) el.appendChild(buildConfigTab2());
    if (S.configTab===3) el.appendChild(buildConfigTab3());
    if (S.configTab===4) el.appendChild(buildConfigTab4());
  } else {
    if (S.gameTab===1) el.appendChild(buildGameTab1());
    if (S.gameTab===2) el.appendChild(buildGameTab2());
    if (S.gameTab===3) el.appendChild(buildGameTab3());
    if (S.gameTab===4) el.appendChild(buildGameTab4());
  }
}

/* ===================== CONFIG TABS ===================== */

function buildConfigTab1(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<h2>Strafaufgaben</h2><p class="hint">Aufgabe und Emoji eingeben.</p><div id="catList"></div>
    <div class="row-btns"><button class="btn" id="addCat">+ Kategorie</button></div>`;
  const list = wrap.querySelector("#catList");

  const renderList = () => {
    list.innerHTML = "";
    S.config.categories.forEach((cat, idx) => {
      const card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = `
        <div class="cat-card-row">
          <input class="cat-icon-input" value="${cat.icon}" placeholder="?">
          <input class="cat-text-input" value="${esc(cat.text)}" placeholder="z.B. Bier trinken">
          <button class="cat-remove" ${S.config.categories.length <= 1 ? 'disabled' : ''}>✕</button>
        </div>`;
      card.querySelector(".cat-icon-input").oninput = (e) => cat.icon = e.target.value;
      card.querySelector(".cat-text-input").oninput = (e) => { cat.text = e.target.value; renderBottomNav(); };
      card.querySelector(".cat-remove").onclick = () => { S.config.categories.splice(idx,1); renderList(); renderBottomNav(); };
      list.appendChild(card);
    });
  };
  wrap.querySelector("#addCat").onclick = () => { S.config.categories.push({id:uid(), icon:"", text:""}); renderList(); renderBottomNav(); };
  renderList();
  return wrap;
}

function buildConfigTab2(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  const dice = [4,6,8,10,12,20];
  wrap.innerHTML = `<h2>Würfeltyp</h2><div class="choice-grid">
    ${dice.map(d => `<button class="choice-btn ${d===S.config.diceType?'active':''}" data-d="${d}">${d===20?'<span class="recommended-badge">Empfohlen</span>':''}D${d}</button>`).join("")}
    </div>`;
  wrap.querySelectorAll(".choice-btn").forEach(btn => {
    btn.onclick = () => {
      S.config.diceType = parseInt(btn.dataset.d, 10);
      wrap.querySelectorAll(".choice-btn").forEach(b => b.classList.toggle("active", b===btn));
      renderBottomNav();
    };
  });
  return wrap;
}

function buildConfigTab3(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<h2>Zeit-Konfiguration</h2>
    <div class="radio-row">
      <div class="radio-opt ${S.config.timeMode==='fixed'?'active':''}" data-mode="fixed">Feste Zeit</div>
      <div class="radio-opt ${S.config.timeMode==='dynamic'?'active':''}" data-mode="dynamic">Dynamisch</div>
    </div>
    <div id="modeFields"></div>`;

  const renderFields = () => {
    const container = wrap.querySelector("#modeFields");
    if (S.config.timeMode === "fixed") {
      container.innerHTML = `<label class="field-label">Stunden</label><input class="num-input" type="number" value="${S.config.fixedHours}" id="fixInp">`;
      container.querySelector("#fixInp").oninput = (e) => S.config.fixedHours = parseInt(e.target.value);
    } else {
      container.innerHTML = `<label class="field-label">Schwierigkeit</label>
        <div class="slider-wrap">
          <input type="range" min="0" max="4" step="1" value="${S.config.dynamicFactorIdx}" id="factSli">
          <div class="slider-labels">${SLIDER_STEPS.map((s,i)=>`<span class="${i===S.config.dynamicFactorIdx?'active':''}">${s.label}<br>(${s.factor})</span>`).join("")}</div>
        </div>`;
      container.querySelector("#factSli").oninput = (e) => {
        S.config.dynamicFactorIdx = parseInt(e.target.value);
        renderFields();
      };
    }
  };
  wrap.querySelectorAll(".radio-opt").forEach(opt => {
    opt.onclick = () => { S.config.timeMode = opt.dataset.mode; renderTabContent(); };
  });
  renderFields();
  return wrap;
}

function buildConfigTab4(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<h2>Wheel of Fortune</h2>
    <div class="toggle-row"><div><strong>Wheel aktivieren</strong></div>
    <div class="toggle ${S.config.wheelEnabled?'on':''}" id="wTog"><div class="knob"></div></div></div>
    <div id="wBody"></div>`;

  const renderBody = () => {
    const body = wrap.querySelector("#wBody");
    if (!S.config.wheelEnabled) { body.innerHTML = ""; return; }
    body.innerHTML = `<div id="fieldList"></div>
      <div class="add-field-row">
        <select id="fType"><option value="time_plus">Zeit +</option><option value="time_minus">Zeit -</option><option value="bonus">Bonus</option><option value="handicap">Handicap</option></select>
        <button class="btn small" id="addF">+ Feld</button>
      </div>`;

    const fList = body.querySelector("#fieldList");
    const renderFList = () => {
      fList.innerHTML = "";
      S.config.wheelFields.forEach((f, idx) => {
        const row = document.createElement("div");
        row.className = "field-row";
        const isTime = f.type.startsWith("time");
        row.innerHTML = `
          <div class="field-row-top"><span class="type-badge ${f.type}">${f.type}</span>
          <input class="field-label-text" value="${esc(f.label)}" placeholder="Name...">
          <button class="field-remove" data-idx="${idx}">✕</button></div>
          ${isTime ? `<div class="field-extra">Stunden: <input class="field-mini-input" type="number" value="${f.hours}"></div>`:''}`;
        row.querySelector(".field-label-text").oninput = (e) => f.label = e.target.value;
        if(isTime) row.querySelector(".field-mini-input").oninput = (e) => f.hours = parseInt(e.target.value);
        row.querySelector(".field-remove").onclick = () => { S.config.wheelFields.splice(idx,1); renderFList(); };
        fList.appendChild(row);
      });
    };
    body.querySelector("#addF").onclick = () => {
      const type = body.querySelector("#fType").value;
      S.config.wheelFields.push({ id: uid(), type, label: "", hours: 2, weight: 1 });
      renderFList();
    };
    renderFList();
  };
  wrap.querySelector("#wTog").onclick = () => { S.config.wheelEnabled = !S.config.wheelEnabled; renderTabContent(); };
  renderBody();
  return wrap;
}

/* ===================== GAME TABS ===================== */

function buildGameTab1(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<h2>Würfeln</h2><div class="dice-stage">
    <div class="die" id="dieEl">?</div><div class="die-type-tag">D${S.config.diceType}</div>
    <div class="pending-badge" id="pBad"></div>
    <div class="row-btns"><button class="btn primary" id="rollB">Würfeln</button></div></div>
    <div id="aList"></div>`;

  const renderAList = () => {
    const list = wrap.querySelector("#aList");
    list.innerHTML = "";
    S.config.categories.forEach(c => {
      const val = S.game.rolls[c.id];
      const active = val === null && S.game.pendingRoll !== null;
      const row = document.createElement("div");
      row.className = "cat-assign-row";
      row.innerHTML = `<div class="cat-assign-icon">${c.icon||'❓'}</div>
        <div class="cat-assign-name">${esc(c.text)}</div>
        <div class="cat-assign-slot ${val?'filled':''} ${active?'assignable':''}">${val||(active?'?':'—')}</div>`;
      if(active) row.onclick = () => { S.game.rolls[c.id] = S.game.pendingRoll; S.game.pendingRoll = null; renderAList(); renderBottomNav(); };
      list.appendChild(row);
    });
    wrap.querySelector("#pBad").innerHTML = S.game.pendingRoll ? `Gewürfelt: <strong>${S.game.pendingRoll}</strong>` : "Bitte würfeln";
    wrap.querySelector("#rollB").disabled = S.game.pendingRoll !== null || S.config.categories.every(c=>S.game.rolls[c.id]!==null);
  };

  wrap.querySelector("#rollB").onclick = () => {
    const die = wrap.querySelector("#dieEl");
    die.classList.add("rolling");
    setTimeout(() => {
      const res = Math.floor(Math.random()*S.config.diceType)+1;
      S.game.pendingRoll = res;
      die.textContent = res;
      die.classList.remove("rolling");
      renderAList();
    }, 600);
  };
  renderAList();
  return wrap;
}

function computeBaseHours(){
  if (S.config.timeMode === "fixed") S.game.baseHours = S.config.fixedHours;
  else {
    const sum = S.config.categories.reduce((a,c)=>a+(S.game.rolls[c.id]||0), 0);
    S.game.baseHours = Math.round(sum * SLIDER_STEPS[S.config.dynamicFactorIdx].factor * 10)/10;
  }
  S.game.totalHours = S.game.baseHours;
}

function buildGameTab2(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<div class="time-hero">
    <div class="big-num">${S.game.baseHours}h</div>
    <div class="unit">Stunden Basis-Zeit</div>
  </div>`;
  return wrap;
}

function buildGameTab3(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  if(!S.config.wheelEnabled) { wrap.innerHTML = "Wheel deaktiviert. Weiter klicken."; return wrap; }

  wrap.innerHTML = `<h2>Wheel of Fortune</h2>
    <div class="wheel-stage">
      <div class="wheel-wrap"><div class="wheel-pointer"></div><div id="wSvg"></div><div class="wheel-center-dot"></div></div>
      <div class="wheel-result-banner" id="wRes"></div>
      <div class="row-btns"><button class="btn primary full" id="spinB">${S.game.hasSpun?'Spin again!':'Spin!'}</button></div>
    </div><div id="resL"></div>`;

  const pool = S.game.wheelPool;
  const drawWheel = () => {
    const holder = wrap.querySelector("#wSvg");
    if(pool.length === 0) { holder.innerHTML = "Rad leer"; return; }
    let paths = "";
    let angle = 0;
    const slice = 360 / pool.length;
    pool.forEach((f, i) => {
      const p1 = polar(100,100,96, angle);
      const p2 = polar(100,100,96, angle + slice);
      const color = ["#3fae63","#e0483f","#2f8f4e","#b8342c"][i%4];
      paths += `<path d="M100,100 L${p1.x},${p1.y} A96,96 0 0 1 ${p2.x},${p2.y} Z" fill="${color}" stroke="#0a0d13"/>`;
      angle += slice;
    });
    holder.innerHTML = `<svg viewBox="0 0 200 200"><g id="rotor" style="transform-origin:100px 100px;">${paths}</g></svg>`;
  };

  const polar = (cx,cy,r,deg) => {
    const rad = (deg-90)*Math.PI/180;
    return { x: cx+r*Math.cos(rad), y: cy+r*Math.sin(rad) };
  };

  wrap.querySelector("#spinB").onclick = () => {
    if(pool.length === 0) return;
    const rotor = wrap.querySelector("#rotor");
    const winnerIdx = Math.floor(Math.random()*pool.length);
    const winner = pool[winnerIdx];
    const rotation = 1440 + (360 - (winnerIdx * (360/pool.length)));
    rotor.style.transition = "transform 3s cubic-bezier(0.15, 0, 0.15, 1)";
    rotor.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      S.game.hasSpun = true;
      if(winner.type.startsWith("time")) {
        const delta = winner.type === "time_plus" ? winner.hours : -winner.hours;
        S.game.totalHours += delta;
        S.game.timeLog.push(`${winner.label || winner.type}: ${delta}h`);
      }
      S.game.wheelResults.push(winner);
      S.game.wheelPool.splice(winnerIdx, 1);
      renderTabContent();
      renderBottomNav();
    }, 3100);
  };

  drawWheel();
  return wrap;
}

function buildGameTab4(){
  const wrap = document.createElement("div");
  wrap.className = "panel";
  wrap.innerHTML = `<h2>Zusammenfassung</h2>
    <div class="final-hero"><div class="big-num">${S.game.totalHours}h</div><div class="unit">Gesamtzeit</div></div>
    <div class="summary-block"><h3>Aufgaben</h3>${S.config.categories.map(c=>`<div class="summary-cat-row"><span>${c.icon} ${c.text}</span><strong>${S.game.rolls[c.id]}</strong></div>`).join("")}</div>
    <div class="row-btns"><button class="btn full" id="saveImg">Als Bild speichern</button></div>`;

  wrap.querySelector("#saveImg").onclick = () => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    script.onload = () => {
      window.html2canvas(wrap, {backgroundColor: "#141924"}).then(canvas => {
        const link = document.createElement("a");
        link.download = "strafe.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    };
    document.head.appendChild(script);
  };

  if(!S.game.confettiFired) { fireConfetti(); S.game.confettiFired = true; }
  return wrap;
}

/* ===================== CONFETTI ===================== */
function fireConfetti(){
  const canvas = document.getElementById("confettiCanvas");
  canvas.classList.remove("hidden");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const pieces = Array.from({length:80}, () => ({
    x: Math.random()*canvas.width, y: -20,
    w: 6+Math.random()*6, h: 6+Math.random()*10,
    color: ["#c8203c","#7a3fc0","#d7a92e"][Math.floor(Math.random()*3)],
    vy: 2+Math.random()*3, vx: -1+Math.random()*2, rot: Math.random()*360
  }));
  let frames = 0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.rot += 5;
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    });
    if(frames++ < 200) requestAnimationFrame(loop);
    else canvas.classList.add("hidden");
  }
  loop();
}

render();
})();
</script>
